version: v2
plugins:
  # Go protobuf stubs
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative
  # Go gRPC stubs
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
  # Dart protobuf + gRPC stubs (for kayten-app)
  - local: protoc-gen-dart
    out: gen/dart
    opt:
      - grpc
