syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

import "google/protobuf/timestamp.proto";
import "kayten/v1/common.proto";

service DeviceService {
  // Request a single-use server nonce for the identity registration
  // proof (2026-04-24 cross-repo plan WP1). MUST be called after
  // `AuthService.VerifyCode` so the server can bind the nonce to a
  // verified `user_id`, `device_id`, and `phone_binding_id`. The
  // returned `server_nonce` is included in the
  // `IdentityRegistrationProof` canonical transcript and consumed by a
  // subsequent `RegisterIdentityKey` call. Replay of the same nonce on
  // a later `RegisterIdentityKey` is rejected.
  //
  // Authentication: bearer JWT from `VerifyCode` / `RefreshToken`.
  //
  // Error taxonomy:
  //   FailedPrecondition — no recent phone verification for this user
  //   InvalidArgument    — device_id / hsm_serial / ed25519_pub shape
  //   ResourceExhausted  — nonce-issuance rate limit exceeded
  rpc RequestIdentityRegistrationNonce(RequestIdentityRegistrationNonceRequest) returns (RequestIdentityRegistrationNonceResponse);

  // Register or replace the device identity key material after HSM setup.
  rpc RegisterIdentityKey(RegisterIdentityKeyRequest) returns (RegisterIdentityKeyResponse);

  // Upload signed prekeys (SPK + OPK batch).
  rpc UploadPrekeys(UploadPrekeysRequest) returns (UploadPrekeysResponse);

  // Fetch a prekey bundle for initiating a session with a device.
  rpc GetPrekey(GetPrekeyRequest) returns (GetPrekeyResponse);

  // Strict per-device identity lookup (CAP_WIRE_IDENTITY_V1). The
  // request's `device_id` MUST resolve to a registered device row —
  // there is NO user-id fallback, NO "first active device" resolution,
  // and NO silent substitution. Mismatched / unknown device_ids return
  // NotFound so the caller can surface a clear error rather than
  // signing / verifying against the wrong key.
  //
  // This RPC is intended for pre-flight enrollment (device attestation,
  // contact-list bootstrap) — NOT for the message-decrypt path. On the
  // decrypt path the wire-authoritative `signer_identity_pub` field on
  // each crypto envelope is the sole source of truth; receivers MUST
  // NOT round-trip through the server to obtain the signer's pub.
  //
  // Replaces the retired `GetIdentityKey` RPC whose handler silently
  // fell back to the first-active-device-for-user path when direct
  // lookup failed — see the retired handler comment in
  // kayten-server/internal/device/handler_grpc.go for the history.
  rpc GetDeviceIdentityKey(GetDeviceIdentityKeyRequest) returns (GetDeviceIdentityKeyResponse);

  // Enumerate all devices registered under a user_id, including
  // revoked devices (with `revoked_at` populated). Used by contact
  // verification UIs that legitimately need per-device fingerprints
  // for the safety-number workflow — the one legitimate multi-device
  // read path that the retired GetIdentityKey fallback was covering.
  // Clients MUST display per-device fingerprints; they MUST NOT blend
  // them into a single "user fingerprint".
  rpc ListUserDevices(ListUserDevicesRequest) returns (ListUserDevicesResponse);

  // Check attestation status for a device.
  rpc GetAttestationStatus(AttestationRequest) returns (AttestationResponse);

  // Revoke a device (marks all keys as invalid).
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);

  // Upload an encrypted file in chunks (client-streaming).
  rpc UploadFile(stream FileChunk) returns (FileUploadResponse);

  // Download an encrypted file in chunks (server-streaming).
  rpc DownloadFile(FileDownloadRequest) returns (stream FileChunk);

  // Auth-gated (Bearer JWT). Called at enrollment success and on every
  // successful LOGIN. Server issues a single-use signed capability JWT
  // scoped to "revoke the caller's device". The app MUST persist the
  // returned capability_jwt in a native outbox companion file OUTSIDE
  // the Keychain/Keystore wipe scope (master §6a.3 / §6a.3.1).
  rpc IssueSelfRevokeCapability(IssueSelfRevokeCapabilityRequest) returns (IssueSelfRevokeCapabilityResponse);

  // UNAUTHENTICATED. Called from the app's wipe-revocation-outbox drain
  // (WorkManager / BGAppRefreshTask) after the local wipe has deleted
  // the JWT refresh token. Server validates the capability_jwt
  // signature + expiry + single-use jti; on success runs the standard
  // RevokeDevice path (prekey retirement, inbound queue cleanup,
  // DEVICE_REVOKED / KEY_CHANGE_ALERT fan-out, identity_keys.revoked_at
  // populated). See master §9c for the full server contract.
  rpc RevokeDeviceByCapability(RevokeDeviceByCapabilityRequest) returns (RevokeDeviceByCapabilityResponse);
}

// Identity commit lifecycle (2026-04-21 HSM identity regeneration spec
// §4.1). The firmware's `Kayten_Mobile_RuntimeStateBlock` persists this
// value in NVM. Host forwards it verbatim on the probe response and on
// every `RegisterIdentityKeyRequest`. Server records it in `devices`
// and `device_identity_rotations`.
enum IdentityCommitState {
  // Field absent or uninitialised. Treated as legacy / pre-spec on
  // the server; the client is expected to fail fast against a server
  // without `SERVER_CAPABILITY_IDENTITY_COMMIT_V1`.
  IDENTITY_COMMIT_STATE_UNSPECIFIED = 0;

  // HSM has never been provisioned. First `PROVISION_DEVICE_V1` will
  // transition to COMMITTED (epoch=1). Host probe returns this when
  // the firmware's NVM block is absent or freshly-zeroed.
  IDENTITY_COMMIT_STATE_UNCOMMITTED = 1;

  // HSM has a committed identity in slots 22/23 and a monotonic
  // `identity_commit_epoch`. Every further `PROVISION_DEVICE_V1` is
  // refused with `ALREADY_PROVISIONED` until a wipe transition.
  IDENTITY_COMMIT_STATE_COMMITTED = 2;

  // HSM has been wiped (via the `0x68` + `0x65` + `0x44` chain) and is
  // awaiting re-provisioning. A subsequent `PROVISION_DEVICE_V1`
  // transitions to COMMITTED with `epoch++`. Server treats rotation
  // from this state as a legitimate re-provision (not a silent
  // regeneration), provided the authenticated gRPC session proves the
  // user.
  IDENTITY_COMMIT_STATE_WIPED = 3;
}

// Signed proof that a rotation request originates from a device that
// another device of the same user has attested. Used on the
// `RegisterIdentityKeyRequest.linking_attestation` field so the server
// can accept a rotation under `AuthMethod.linking_attestation` without
// an SMS re-verify (spec §4.7, `validateRotationAuth` linking branch).
//
// Transcript signed by the linker device's Ed25519 identity key:
//
//   "kayten-link-attestation-v1" || SEP(0x00)
//     || linker_device_id (UTF-8 bytes)       || SEP(0x00)
//     || target_device_id (UTF-8 bytes)       || SEP(0x00)
//     || target_identity_pub (32 bytes)       || SEP(0x00)
//     || issued_at_unix_ms (uint64 LE, 8 B)   || SEP(0x00)
//     || nonce (32 bytes)
//
// SEP is a single 0x00 byte. Binary fields are included verbatim; the
// UTF-8 bytes of the string identifiers are included exactly as they
// appear in the `linker_device_id` / `target_device_id` fields so the
// verifier reconstructs the transcript without ambiguity.
message LinkingAttestation {
  // Device that is attesting this rotation. Must belong to the same
  // user as the target device, be unrevoked at attestation issue time,
  // and have `can_attest == true` at server-side validation time.
  string linker_device_id = 1;

  // Device whose identity is rotating. MUST match
  // `RegisterIdentityKeyRequest.device_id` in the enclosing request.
  // Servers that implement `SERVER_CAPABILITY_IDENTITY_COMMIT_V1` reject
  // mismatches with the generic `InvalidArgument` gRPC status; see the
  // error taxonomy in the 2026-04-21 HSM identity regen spec §4.7.
  string target_device_id = 2;

  // Proposed new identity pub of the target device. MUST match
  // `RegisterIdentityKeyRequest.ed25519_pub` in the enclosing request
  // byte-for-byte. Servers that implement `SERVER_CAPABILITY_IDENTITY_COMMIT_V1`
  // reject mismatches with the generic `InvalidArgument` gRPC status; see
  // the error taxonomy in the 2026-04-21 HSM identity regen spec §4.7.
  bytes target_identity_pub = 3;

  // Millisecond UNIX timestamp at which the linker signed this blob.
  // Server rejects if older than 5 minutes or in the future by more
  // than 60 seconds (clock-skew tolerance).
  int64 issued_at_unix_ms = 4;

  // 32 bytes of linker-supplied entropy. Server records the nonce on
  // acceptance and rejects any replay of the same nonce (global across
  // users, per spec §4.7 item (f)).
  bytes nonce = 5;

  // Ed25519 signature over the transcript above, produced by the
  // linker device's identity key in HSM slot 22. Server verifies
  // against the linker's `devices.ed25519_pub` stored column.
  bytes signature = 6;
}

message Prekey {
  int32 prekey_id = 1;
  bytes ecdh_pub = 2;
  bytes signature = 3;
  bool is_one_time = 4;
  string curve_type = 5;
}

// Signed proof of HSM possession for identity registration (2026-04-24
// cross-repo plan WP1). Built by the app from fields the server has
// already issued (user_id, device_id, phone_binding_id, server_nonce)
// plus fields the HSM reports (identity pub, ECDH pub, commit state,
// commit epoch, hsm_serial). The app encodes the fields into the
// canonical transcript specified in
// `docs/canonical-transcript-encoder-v1.md`, hashes the transcript with
// SHA-256, and asks the HSM to sign the digest with the identity
// Ed25519 key under purpose `IDENTITY_REGISTRATION`.
//
// Security model:
//   - `domain_tag` MUST equal `IDENTITY_REGISTRATION_DOMAIN_TAG_V1` —
//     the SHA-256 digest of the ASCII string
//     `"kayten-identity-registration-v1"`. Hex value pinned in the
//     encoder doc. Any other value is a wire-level error.
//   - `server_nonce` MUST match a nonce issued via
//     `RequestIdentityRegistrationNonce` to this exact user/device/
//     phone_binding and not yet consumed.
//   - `client_nonce` is 32 bytes of caller-supplied entropy, preferably
//     from the HSM TRNG.
//   - `phone_binding_id` is an opaque server-issued binding returned
//     from a recent successful phone verification. The raw phone
//     number is NEVER placed in this field.
//   - All duplicated top-level fields on `RegisterIdentityKeyRequest`
//     MUST agree byte-for-byte with the fields inside `proof`.
//     Servers with `SERVER_CAPABILITY_IDENTITY_PROOF_V1` reject any
//     disagreement with `InvalidArgument`.
//   - `signature` is Ed25519 over `sha256(canonical_transcript)`.
//     Verified against `ed25519_identity_pub` in this same message.
message IdentityRegistrationProof {
  // 32-byte purpose/domain tag. Pinned to
  // `IDENTITY_REGISTRATION_DOMAIN_TAG_V1` —
  // sha256("kayten-identity-registration-v1") =
  // 40547e31bafc49be8ae9f98e821b4dcce0e8ebea336ec0c0b653e0ced525e4d6.
  bytes domain_tag = 1;

  // Authenticated user ID. MUST match the caller's JWT subject.
  string user_id = 2;

  // Opaque server-issued handle for a recent successful phone
  // verification. Issued on `AuthService.VerifyCode` completion and
  // consumed by a subsequent `RegisterIdentityKey`. The raw phone
  // number MUST NEVER appear in this field.
  string phone_binding_id = 3;

  // Device ID. MUST match the caller's JWT device_id claim.
  string device_id = 4;

  // HSM serial number as reported by the HSM. Production servers MUST
  // reject shared/default/blank serials.
  string hsm_serial = 5;

  // Ed25519 identity public key. Exactly 32 bytes.
  bytes ed25519_identity_pub = 6;

  // ECDH identity public key. 33 bytes (P-256 compressed) or 65 bytes
  // (P-256 uncompressed, leading 0x04). No other encodings accepted.
  bytes ecdh_identity_pub = 7;

  // HSM-reported commit state at the moment the proof was built. MUST
  // be `IDENTITY_COMMIT_STATE_COMMITTED` for every accepted proof.
  IdentityCommitState commit_state = 8;

  // HSM-reported commit epoch. MUST be ≥ 1.
  uint64 commit_epoch = 9;

  // Millisecond Unix timestamp at which the app built the proof.
  // Server rejects if outside clock-skew tolerance (default ±60s for
  // the future bound, ±5min for the past bound — tuned per-deploy).
  int64 issued_at_unix_ms = 10;

  // 32 bytes issued by the server via
  // `RequestIdentityRegistrationNonce`. Single-use, scoped to the
  // authenticated user/device/phone_binding. Replay of the same nonce
  // on a later `RegisterIdentityKey` is rejected.
  bytes server_nonce = 11;

  // 32 bytes of client-supplied entropy, preferably from the HSM
  // TRNG. Ensures the transcript is unique even if the server nonce
  // is somehow replayed.
  bytes client_nonce = 12;

  // Ed25519 signature over `sha256(canonical_transcript)`. The
  // transcript layout is pinned in
  // `docs/canonical-transcript-encoder-v1.md`.
  bytes signature = 13;
}

// Rotation authorization (2026-04-24 cross-repo plan WP1). Carried on
// `RegisterIdentityKeyRequest.rotation_auth`. The server uses this to
// decide whether an identity pub change is legitimate and, if so, which
// authenticated rotation method authorized it. A stale JWT alone MUST
// NOT authorize an identity pub change — the server requires one of
// the typed auth methods below.
//
// Auth methods in increasing trust order:
//   FIRST_COMMIT              — no prior identity for this user/device;
//                               proof alone plus fresh SMS verify is
//                               sufficient.
//   RECENT_SMS_REVERIFY       — the user proved control of the phone
//                               number within the server's recency
//                               window (default ~10 minutes) by
//                               completing `AuthService.VerifyCode`.
//   ACCOUNT_RECOVERY_TOKEN    — the user supplied a valid recovery
//                               token previously issued via the
//                               account-recovery flow.
//   PRIMARY_DEVICE_ATTESTATION — another device of the same user
//                               cross-signed the proposed new
//                               identity (see `LinkingAttestation`).
//                               Only available when multi-device is
//                               enabled for this deploy.
//
// `KAYTEN_DEV_RESET_ON_STARTUP` is NOT a rotation auth method. Dev
// reset is a client/server state-clear signal, not a trust decision.
// Production servers MUST fail startup rather than accept a dev-reset
// rotation path.
message IdentityRotationAuth {
  enum Method {
    METHOD_UNSPECIFIED = 0;
    METHOD_FIRST_COMMIT = 1;
    METHOD_RECENT_SMS_REVERIFY = 2;
    METHOD_ACCOUNT_RECOVERY_TOKEN = 3;
    METHOD_PRIMARY_DEVICE_ATTESTATION = 4;
  }

  Method method = 1;

  // Opaque server-issued handle referencing a successful SMS
  // re-verification completed within the server's recency window.
  // Required when `method == METHOD_RECENT_SMS_REVERIFY`. Empty
  // otherwise.
  string sms_reverify_id = 2;

  // Opaque server-issued recovery token. Single-use. Required when
  // `method == METHOD_ACCOUNT_RECOVERY_TOKEN`. Empty otherwise.
  bytes account_recovery_token = 3;

  // Cross-device attestation from a primary device of the same user.
  // Required when `method == METHOD_PRIMARY_DEVICE_ATTESTATION`.
  // Empty otherwise. See `LinkingAttestation` for the signed
  // transcript format.
  LinkingAttestation linking_attestation = 4;
}

message RequestIdentityRegistrationNonceRequest {
  // Authenticated user ID. Server cross-checks against JWT subject.
  string user_id = 1;

  // Authenticated device ID. Server cross-checks against JWT device
  // claim. Must be the device that just completed `VerifyCode`.
  string device_id = 2;

  // HSM serial as reported by the HSM probe. Production servers
  // reject shared/default/blank serials.
  string hsm_serial = 3;

  // Identity Ed25519 public key the app intends to register. Server
  // binds the issued nonce to this pub so a proof built with a
  // different pub fails verification.
  bytes ed25519_identity_pub = 4;
}

message RequestIdentityRegistrationNonceResponse {
  // Opaque server-issued handle referencing the recent phone
  // verification that authorized this nonce. The app echoes this
  // value verbatim into `IdentityRegistrationProof.phone_binding_id`.
  // The server never exposes the raw phone number through this
  // handle.
  string phone_binding_id = 1;

  // 32 bytes of server entropy. The app includes this verbatim in
  // the canonical transcript. Single-use.
  bytes server_nonce = 2;

  // Millisecond Unix timestamp after which the server will reject
  // any `RegisterIdentityKey` that consumes this nonce. Typical TTL
  // is 5 minutes.
  int64 expires_at_unix_ms = 3;
}

message RegisterIdentityKeyRequest {
  string device_id = 1;
  bytes ed25519_pub = 2;
  bytes ecdh_pub = 3;
  bytes signature = 4;
  string curve_type = 5;

  // Monotonic commit epoch (2026-04-21 HSM identity regen spec §4.1).
  // Firmware persists this in NVM; host surfaces it on the probe; app
  // threads it through here. First-commit request carries `1`. Absent
  // / 0 on pre-delta clients — the server treats that as legacy and
  // routes through grace-accept mode if enabled.
  uint32 identity_commit_epoch = 6;

  // Current firmware-reported commit state. Servers with
  // `SERVER_CAPABILITY_IDENTITY_COMMIT_V1` require this to be
  // `IDENTITY_COMMIT_STATE_COMMITTED` for every accepted registration.
  // `UNSPECIFIED` is treated as legacy (grace-accept). `UNCOMMITTED`
  // / `WIPED` at registration time is a wire-level error: the firmware
  // should have advanced to `COMMITTED` by the time the app ships the
  // request.
  IdentityCommitState identity_commit_state = 7;

  // Present only when rotation auth is `linking_attestation` per spec
  // §4.7 validateRotationAuth branch 1. Absent for first-commits,
  // no-rotation metadata refreshes, SMS-reverify paths, and recovery-
  // token paths. Server ignores this field when the incoming request
  // would have been accepted under a simpler auth_method.
  //
  // DEPRECATED by `rotation_auth` for post-WP1 clients. Kept for
  // backward compatibility during rollout — servers with
  // `SERVER_CAPABILITY_IDENTITY_PROOF_V1` prefer
  // `rotation_auth.linking_attestation` and treat the top-level field
  // as a fallback only when `rotation_auth` is unset.
  LinkingAttestation linking_attestation = 8;

  // HSM serial. Production servers reject shared/default/blank
  // serials. Top-level mirror of `proof.hsm_serial`; servers with
  // `SERVER_CAPABILITY_IDENTITY_PROOF_V1` reject disagreement with
  // the signed proof.
  string hsm_serial = 9;

  // HSM proof of possession for this identity registration (WP1).
  // Required when the server advertises
  // `SERVER_CAPABILITY_IDENTITY_PROOF_V1`. Canonical transcript +
  // domain tag pinned in `docs/canonical-transcript-encoder-v1.md`.
  IdentityRegistrationProof proof = 10;

  // Rotation authorization (WP1). Required for any registration that
  // results in an identity pub change for an existing user (including
  // HSM replacement that resets the firmware epoch to 1). Optional
  // for first-commit on a brand-new user — servers with
  // `SERVER_CAPABILITY_IDENTITY_PROOF_V1` infer `METHOD_FIRST_COMMIT`
  // from the absence of a prior lineage.
  IdentityRotationAuth rotation_auth = 11;

  // Per-device capability advertisement (FIX-3, 2026-05-09 audit
  // roadmap). Clients populate this with every `DeviceCapability` value
  // they actually implement at the build/runtime level. The server
  // records the declared set into `devices.advertised_device_capabilities`
  // (JSONB or bitmask column, migration `04X_devices_advertised_capabilities`).
  // At `OfferCall` time the server queries the recipient device's stored
  // capabilities to gate video offers: if the recipient does not carry
  // `DEVICE_CAPABILITY_CALL_VIDEO_V1` the server rejects the video offer
  // with `FailedPrecondition "video_unsupported_by_recipient"`. This
  // replaces the `current_identity_commit_epoch >= 1` proxy gate used
  // in Step 9 Phase 2 (`207b578`) which approximates but cannot reliably
  // distinguish "provisioned post-video-build" from "actually has the
  // video media stack." Clients MUST NOT set a capability they do not
  // implement; the server MUST NOT treat capability declarations as a
  // security boundary (the gate is best-effort UX). Pre-delta clients
  // that omit this field are treated as having an empty capability set.
  // See FIX-3 in
  // `kayten-app/docs/superpowers/reviews/2026-05-09-audit-findings-and-remediation-roadmap.md`.
  repeated DeviceCapability advertised_device_capabilities = 12;
}

message RegisterIdentityKeyResponse {
  bool success = 1;

  // SP-7 — Re-Registration Identity Continuity (see spec
  // docs/superpowers/specs/2026-05-16-sp7-re-registration-identity-
  // continuity-design.md §3.6).
  //
  // True when the user record had a prior identity registration
  // (server-side `previous != nil` in `UpsertIdentityKeyWithRotationAudit`
  // — any prior commit, regardless of whether the key actually changed).
  //
  // 2026-05-19 clarification: this flag is INFORMATIONAL only — it
  // fires for BOTH real rotations AND no-op refreshes of the same
  // Ed25519 key. The earlier doc-comment incorrectly implied it only
  // fires on key changes, which led the kayten-app SP-7 client to wipe
  // local state on every re-registration including same-key refreshes
  // (observed as an infinite re-registration loop on Pixel 10 + HSM
  // re-provision, 2026-05-19 — see investigation memory).
  //
  // Client SHOULD use this field ONLY for the recovery-card / "welcome
  // back" UX — NOT for gating local data wipe. Wipe decisions MUST
  // use `is_rotation` (field 3) which carries the server's internal
  // `isRotation = previous != nil && previous.Ed25519Pub != incoming.Ed25519Pub`
  // semantic.
  //
  // Pre-delta clients ignore this field (proto3 default false = treat
  // as initial commit, no special handling).
  bool prior_identity_existed = 2;

  // SP-7 v2 (2026-05-19) — explicit rotation discriminator.
  //
  // True when the server-side `isRotation = previous != nil &&
  // previous.Ed25519Pub != incoming.Ed25519Pub` was true, i.e. the
  // user re-registered with a DIFFERENT Ed25519 identity key than the
  // currently-stored one. This is the exact gate the server uses
  // internally to decide whether to run its own data-side wipe
  // (`AffectedGroupIDs` soft-leave, `RevokedDeviceIDs` revocation,
  // prekey deletion, KEY_CHANGE_ALERT fan-out).
  //
  // Client MUST use this field — NOT `prior_identity_existed` — to
  // decide whether to run the SP-7 local data wipe. The earlier
  // behavior of wiping on any `prior_identity_existed=true` caused
  // an infinite re-registration loop after an HSM re-provision (every
  // unlock retry hit the SP-7 path even though the local enrollment
  // matched the re-sent identity).
  //
  // Wire-compat contract:
  //
  //   Pre-delta SERVER + post-delta CLIENT:
  //     `is_rotation` arrives as proto3 default `false`. Client treats
  //     "false" as "skip local wipe". This is SAFE — the only loss is
  //     that genuine rotations against pre-delta servers won't trigger
  //     the local wipe; users in that scenario must explicitly use the
  //     "Erase and reset HSM" path. Pre-delta servers are end-of-life
  //     once any client deploys this field.
  //
  //   Post-delta SERVER + pre-delta CLIENT:
  //     Pre-delta clients keep wiping on every `prior_identity_existed`
  //     bounce. Behavior is unchanged from the loop-bug state. Clients
  //     MUST roll forward to consume `is_rotation`.
  //
  //   Post-delta SERVER + post-delta CLIENT:
  //     Same-key refresh: prior_identity_existed=true, is_rotation=false
  //       → client shows informational card, NO wipe. Loop gone.
  //     Real rotation: prior_identity_existed=true, is_rotation=true
  //       → client runs SP-7 wipe + shows card. Spec §3.7 semantics
  //       preserved.
  //     First commit: prior_identity_existed=false, is_rotation=false
  //       → no card, no wipe.
  //
  // Pre-delta clients ignore this field entirely (no change in
  // observable behavior).
  bool is_rotation = 3;
}

message UploadPrekeysRequest {
  string device_id = 1;
  repeated Prekey prekeys = 2;
}

message UploadPrekeysResponse {
  int32 stored_count = 1;
}

message GetPrekeyRequest {
  string device_id = 1;
  string curve_type = 2;
}

message GetPrekeyResponse {
  Prekey signed_prekey = 1;
  Prekey one_time_prekey = 2;
  bytes identity_ed25519_pub = 3;
  bytes identity_ecdh_pub = 4;
}

message GetDeviceIdentityKeyRequest {
  // Strict per-device identity. MUST be a registered device_id; the
  // server does NOT resolve user_ids here.
  string device_id = 1;
}

message GetDeviceIdentityKeyResponse {
  bytes ed25519_pub = 1;
  bytes ecdh_pub = 2;
  bytes signature = 3;

  // When set, the device has been revoked (PIN-lockout wipe, user-initiated
  // wipe, or admin `RevokeDevice`). Consumers MUST refuse to start a new
  // conversation with this identity and raise a KEY_CHANGE_ALERT-driven
  // re-verification UX. Unset on active devices.
  //
  // Populated by `kayten-server` whenever `devices.revoked_at IS NOT NULL`
  // (see master §6a.4 and the `kayten-server-device-wipe-integration` spec).
  google.protobuf.Timestamp revoked_at = 4;
}

message ListUserDevicesRequest {
  string user_id = 1;
  // When true, include revoked devices in the response (with
  // `revoked_at` populated). Contact-verify UIs should pass true so
  // users can see former / no-longer-trusted devices alongside active
  // ones. Default false — most callers only care about active devices.
  bool include_revoked = 2;
}

message ListUserDevicesResponse {
  repeated DeviceIdentity devices = 1;
}

message DeviceIdentity {
  string device_id = 1;
  bytes ed25519_pub = 2;
  bytes ecdh_pub = 3;
  string curve_type = 4;
  google.protobuf.Timestamp created_at = 5;
  // Populated when the device is revoked; unset on active devices.
  google.protobuf.Timestamp revoked_at = 6;

  // Current commit epoch from the server's record for this device.
  // Populated by servers with `SERVER_CAPABILITY_IDENTITY_COMMIT_V1`;
  // zero on legacy servers. Consumers use this alongside
  // `created_at` to display rotation history in contact-verify UIs.
  uint32 identity_commit_epoch = 7;

  // Current commit state (COMMITTED on active devices; WIPED on
  // devices that are pending re-provision; UNCOMMITTED never
  // appears here because a device with no identity is never in
  // ListUserDevices results).
  IdentityCommitState identity_commit_state = 8;

  // Server-side monotonic identity version for the lineage this
  // device belongs to (2026-04-24 cross-repo plan WP4). Increments
  // on every accepted pub-change rotation, including HSM
  // replacement events where the firmware epoch restarts at 1.
  // Zero on legacy servers that do not implement user-level
  // lineage. Clients use this to detect rotations the firmware
  // epoch alone cannot distinguish (e.g. two successive HSM
  // replacements).
  uint64 server_identity_version = 9;

  // Lineage/rotation identifier for the current rotation row. A
  // UUID generated by the server on every accepted rotation. Empty
  // on legacy servers and on devices that have never rotated.
  // Clients may use this to correlate receiver `KEY_CHANGE_ALERT`
  // events with a specific server-observed rotation.
  string current_rotation_id = 10;

  // True when the server has accepted a rotation but the device's
  // peers have not yet verified the new identity. Clients SHOULD
  // show an identity-change banner to receivers until they
  // explicitly verify. The server does not auto-clear this flag.
  bool post_rotation_pending_verify = 11;

  // Millisecond Unix timestamp of the most recent accepted
  // rotation for this device's lineage. Zero if the device has
  // never rotated.
  int64 rotated_at_unix_ms = 12;
}

message AttestationRequest {
  string device_id = 1;
}

message AttestationResponse {
  bool is_verified = 1;
  string security_level = 2;
  string os_version = 3;
}

message RevokeDeviceRequest {
  string device_id = 1;
  string reason = 2;
}

message RevokeDeviceResponse {
  bool success = 1;
}

message FileChunk {
  string file_id = 1;
  int32 chunk_index = 2;
  bytes data = 3;
  int64 total_size = 4;
  string mime_type = 5;
  bytes sha256_hash = 6;
  string conversation_id = 7;
}

message FileUploadResponse {
  string file_id = 1;
  int64 size_bytes = 2;
  string conversation_id = 3;
}

message FileDownloadRequest {
  string file_id = 1;
}

message IssueSelfRevokeCapabilityRequest {
  // Intentionally empty — device_id is derived from auth context server-side.
}

message IssueSelfRevokeCapabilityResponse {
  // Compact JWT (HS256) with payload:
  //   { iss: "kayten-server", sub: <device_id>,
  //     aud: "self-revoke", jti: <uuid-v4>,
  //     iat: <unix-seconds>, exp: <iat + 30d> }
  // Signed with server-side `revocation_signing_key` (rotatable).
  string capability_jwt = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RevokeDeviceByCapabilityRequest {
  // Exactly the JWT issued by IssueSelfRevokeCapability.
  string capability_jwt = 1;
  // Free-form: "pin_lockout_wipe" | "user_requested" | "silent_wipe_detected" | …
  string reason = 2;
}

message RevokeDeviceByCapabilityResponse {
  // Empty. gRPC status carries outcome:
  //   OK                    — revoke applied, jti marked used
  //   FAILED_PRECONDITION   — jti already used (idempotent success; app clears outbox)
  //   UNAUTHENTICATED       — signature invalid or exp in past
  //   RESOURCE_EXHAUSTED    — rate-limited (3 req/sub/min)
}
