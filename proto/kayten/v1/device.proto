syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

import "google/protobuf/timestamp.proto";

service DeviceService {
  // Register or replace the device identity key material after HSM setup.
  rpc RegisterIdentityKey(RegisterIdentityKeyRequest) returns (RegisterIdentityKeyResponse);

  // Upload signed prekeys (SPK + OPK batch).
  rpc UploadPrekeys(UploadPrekeysRequest) returns (UploadPrekeysResponse);

  // Fetch a prekey bundle for initiating a session with a device.
  rpc GetPrekey(GetPrekeyRequest) returns (GetPrekeyResponse);

  // Strict per-device identity lookup (CAP_WIRE_IDENTITY_V1). The
  // request's `device_id` MUST resolve to a registered device row —
  // there is NO user-id fallback, NO "first active device" resolution,
  // and NO silent substitution. Mismatched / unknown device_ids return
  // NotFound so the caller can surface a clear error rather than
  // signing / verifying against the wrong key.
  //
  // This RPC is intended for pre-flight enrollment (device attestation,
  // contact-list bootstrap) — NOT for the message-decrypt path. On the
  // decrypt path the wire-authoritative `signer_identity_pub` field on
  // each crypto envelope is the sole source of truth; receivers MUST
  // NOT round-trip through the server to obtain the signer's pub.
  //
  // Replaces the retired `GetIdentityKey` RPC whose handler silently
  // fell back to the first-active-device-for-user path when direct
  // lookup failed — see the retired handler comment in
  // kayten-server/internal/device/handler_grpc.go for the history.
  rpc GetDeviceIdentityKey(GetDeviceIdentityKeyRequest) returns (GetDeviceIdentityKeyResponse);

  // Enumerate all devices registered under a user_id, including
  // revoked devices (with `revoked_at` populated). Used by contact
  // verification UIs that legitimately need per-device fingerprints
  // for the safety-number workflow — the one legitimate multi-device
  // read path that the retired GetIdentityKey fallback was covering.
  // Clients MUST display per-device fingerprints; they MUST NOT blend
  // them into a single "user fingerprint".
  rpc ListUserDevices(ListUserDevicesRequest) returns (ListUserDevicesResponse);

  // Check attestation status for a device.
  rpc GetAttestationStatus(AttestationRequest) returns (AttestationResponse);

  // Revoke a device (marks all keys as invalid).
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);

  // Upload an encrypted file in chunks (client-streaming).
  rpc UploadFile(stream FileChunk) returns (FileUploadResponse);

  // Download an encrypted file in chunks (server-streaming).
  rpc DownloadFile(FileDownloadRequest) returns (stream FileChunk);

  // Auth-gated (Bearer JWT). Called at enrollment success and on every
  // successful LOGIN. Server issues a single-use signed capability JWT
  // scoped to "revoke the caller's device". The app MUST persist the
  // returned capability_jwt in a native outbox companion file OUTSIDE
  // the Keychain/Keystore wipe scope (master §6a.3 / §6a.3.1).
  rpc IssueSelfRevokeCapability(IssueSelfRevokeCapabilityRequest) returns (IssueSelfRevokeCapabilityResponse);

  // UNAUTHENTICATED. Called from the app's wipe-revocation-outbox drain
  // (WorkManager / BGAppRefreshTask) after the local wipe has deleted
  // the JWT refresh token. Server validates the capability_jwt
  // signature + expiry + single-use jti; on success runs the standard
  // RevokeDevice path (prekey retirement, inbound queue cleanup,
  // DEVICE_REVOKED / KEY_CHANGE_ALERT fan-out, identity_keys.revoked_at
  // populated). See master §9c for the full server contract.
  rpc RevokeDeviceByCapability(RevokeDeviceByCapabilityRequest) returns (RevokeDeviceByCapabilityResponse);
}

// Identity commit lifecycle (2026-04-21 HSM identity regeneration spec
// §4.1). The firmware's `Kayten_Mobile_RuntimeStateBlock` persists this
// value in NVM. Host forwards it verbatim on the probe response and on
// every `RegisterIdentityKeyRequest`. Server records it in `devices`
// and `device_identity_rotations`.
enum IdentityCommitState {
  // Field absent or uninitialised. Treated as legacy / pre-spec on
  // the server; the client is expected to fail fast against a server
  // without `SERVER_CAPABILITY_IDENTITY_COMMIT_V1`.
  IDENTITY_COMMIT_STATE_UNSPECIFIED = 0;

  // HSM has never been provisioned. First `PROVISION_DEVICE_V1` will
  // transition to COMMITTED (epoch=1). Host probe returns this when
  // the firmware's NVM block is absent or freshly-zeroed.
  IDENTITY_COMMIT_STATE_UNCOMMITTED = 1;

  // HSM has a committed identity in slots 22/23 and a monotonic
  // `identity_commit_epoch`. Every further `PROVISION_DEVICE_V1` is
  // refused with `ALREADY_PROVISIONED` until a wipe transition.
  IDENTITY_COMMIT_STATE_COMMITTED = 2;

  // HSM has been wiped (via the `0x68` + `0x65` + `0x44` chain) and is
  // awaiting re-provisioning. A subsequent `PROVISION_DEVICE_V1`
  // transitions to COMMITTED with `epoch++`. Server treats rotation
  // from this state as a legitimate re-provision (not a silent
  // regeneration), provided the authenticated gRPC session proves the
  // user.
  IDENTITY_COMMIT_STATE_WIPED = 3;
}

// Signed proof that a rotation request originates from a device that
// another device of the same user has attested. Used on the
// `RegisterIdentityKeyRequest.linking_attestation` field so the server
// can accept a rotation under `AuthMethod.linking_attestation` without
// an SMS re-verify (spec §4.7, `validateRotationAuth` linking branch).
//
// Transcript signed by the linker device's Ed25519 identity key:
//
//   "kayten-link-attestation-v1" || SEP(0x00)
//     || linker_device_id (UTF-8 bytes)       || SEP(0x00)
//     || target_device_id (UTF-8 bytes)       || SEP(0x00)
//     || target_identity_pub (32 bytes)       || SEP(0x00)
//     || issued_at_unix_ms (uint64 LE, 8 B)   || SEP(0x00)
//     || nonce (32 bytes)
//
// SEP is a single 0x00 byte. Binary fields are included verbatim; the
// UTF-8 bytes of the string identifiers are included exactly as they
// appear in the `linker_device_id` / `target_device_id` fields so the
// verifier reconstructs the transcript without ambiguity.
message LinkingAttestation {
  // Device that is attesting this rotation. Must belong to the same
  // user as the target device, be unrevoked at attestation issue time,
  // and have `can_attest == true` at server-side validation time.
  string linker_device_id = 1;

  // Device whose identity is rotating. MUST match
  // `RegisterIdentityKeyRequest.device_id` in the enclosing request
  // or the server returns `ErrAttesterWrongTarget`.
  string target_device_id = 2;

  // Proposed new identity pub of the target device. MUST match
  // `RegisterIdentityKeyRequest.ed25519_pub` in the enclosing request
  // byte-for-byte; otherwise server returns `ErrAttestationMismatch`.
  bytes target_identity_pub = 3;

  // Millisecond UNIX timestamp at which the linker signed this blob.
  // Server rejects if older than 5 minutes or in the future by more
  // than 60 seconds (clock-skew tolerance).
  int64 issued_at_unix_ms = 4;

  // 32 bytes of linker-supplied entropy. Server records the nonce on
  // acceptance and rejects any replay of the same nonce (global across
  // users, per spec §4.7 item (f)).
  bytes nonce = 5;

  // Ed25519 signature over the transcript above, produced by the
  // linker device's identity key in HSM slot 22. Server verifies
  // against the linker's `devices.ed25519_pub` stored column.
  bytes signature = 6;
}

message Prekey {
  int32 prekey_id = 1;
  bytes ecdh_pub = 2;
  bytes signature = 3;
  bool is_one_time = 4;
  string curve_type = 5;
}

message RegisterIdentityKeyRequest {
  string device_id = 1;
  bytes ed25519_pub = 2;
  bytes ecdh_pub = 3;
  bytes signature = 4;
  string curve_type = 5;

  // Monotonic commit epoch (2026-04-21 HSM identity regen spec §4.1).
  // Firmware persists this in NVM; host surfaces it on the probe; app
  // threads it through here. First-commit request carries `1`. Absent
  // / 0 on pre-delta clients — the server treats that as legacy and
  // routes through grace-accept mode if enabled.
  uint32 identity_commit_epoch = 6;

  // Current firmware-reported commit state. Servers with
  // `SERVER_CAPABILITY_IDENTITY_COMMIT_V1` require this to be
  // `IDENTITY_COMMIT_STATE_COMMITTED` for every accepted registration.
  // `UNSPECIFIED` is treated as legacy (grace-accept). `UNCOMMITTED`
  // / `WIPED` at registration time is a wire-level error: the firmware
  // should have advanced to `COMMITTED` by the time the app ships the
  // request.
  IdentityCommitState identity_commit_state = 7;

  // Present only when rotation auth is `linking_attestation` per spec
  // §4.7 validateRotationAuth branch 1. Absent for first-commits,
  // no-rotation metadata refreshes, SMS-reverify paths, and recovery-
  // token paths. Server ignores this field when the incoming request
  // would have been accepted under a simpler auth_method.
  LinkingAttestation linking_attestation = 8;
}

message RegisterIdentityKeyResponse {
  bool success = 1;
}

message UploadPrekeysRequest {
  string device_id = 1;
  repeated Prekey prekeys = 2;
}

message UploadPrekeysResponse {
  int32 stored_count = 1;
}

message GetPrekeyRequest {
  string device_id = 1;
  string curve_type = 2;
}

message GetPrekeyResponse {
  Prekey signed_prekey = 1;
  Prekey one_time_prekey = 2;
  bytes identity_ed25519_pub = 3;
  bytes identity_ecdh_pub = 4;
}

message GetDeviceIdentityKeyRequest {
  // Strict per-device identity. MUST be a registered device_id; the
  // server does NOT resolve user_ids here.
  string device_id = 1;
}

message GetDeviceIdentityKeyResponse {
  bytes ed25519_pub = 1;
  bytes ecdh_pub = 2;
  bytes signature = 3;

  // When set, the device has been revoked (PIN-lockout wipe, user-initiated
  // wipe, or admin `RevokeDevice`). Consumers MUST refuse to start a new
  // conversation with this identity and raise a KEY_CHANGE_ALERT-driven
  // re-verification UX. Unset on active devices.
  //
  // Populated by `kayten-server` whenever `devices.revoked_at IS NOT NULL`
  // (see master §6a.4 and the `kayten-server-device-wipe-integration` spec).
  google.protobuf.Timestamp revoked_at = 4;
}

message ListUserDevicesRequest {
  string user_id = 1;
  // When true, include revoked devices in the response (with
  // `revoked_at` populated). Contact-verify UIs should pass true so
  // users can see former / no-longer-trusted devices alongside active
  // ones. Default false — most callers only care about active devices.
  bool include_revoked = 2;
}

message ListUserDevicesResponse {
  repeated DeviceIdentity devices = 1;
}

message DeviceIdentity {
  string device_id = 1;
  bytes ed25519_pub = 2;
  bytes ecdh_pub = 3;
  string curve_type = 4;
  google.protobuf.Timestamp created_at = 5;
  // Populated when the device is revoked; unset on active devices.
  google.protobuf.Timestamp revoked_at = 6;
}

message AttestationRequest {
  string device_id = 1;
}

message AttestationResponse {
  bool is_verified = 1;
  string security_level = 2;
  string os_version = 3;
}

message RevokeDeviceRequest {
  string device_id = 1;
  string reason = 2;
}

message RevokeDeviceResponse {
  bool success = 1;
}

message FileChunk {
  string file_id = 1;
  int32 chunk_index = 2;
  bytes data = 3;
  int64 total_size = 4;
  string mime_type = 5;
  bytes sha256_hash = 6;
  string conversation_id = 7;
}

message FileUploadResponse {
  string file_id = 1;
  int64 size_bytes = 2;
  string conversation_id = 3;
}

message FileDownloadRequest {
  string file_id = 1;
}

message IssueSelfRevokeCapabilityRequest {
  // Intentionally empty — device_id is derived from auth context server-side.
}

message IssueSelfRevokeCapabilityResponse {
  // Compact JWT (HS256) with payload:
  //   { iss: "kayten-server", sub: <device_id>,
  //     aud: "self-revoke", jti: <uuid-v4>,
  //     iat: <unix-seconds>, exp: <iat + 30d> }
  // Signed with server-side `revocation_signing_key` (rotatable).
  string capability_jwt = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RevokeDeviceByCapabilityRequest {
  // Exactly the JWT issued by IssueSelfRevokeCapability.
  string capability_jwt = 1;
  // Free-form: "pin_lockout_wipe" | "user_requested" | "silent_wipe_detected" | …
  string reason = 2;
}

message RevokeDeviceByCapabilityResponse {
  // Empty. gRPC status carries outcome:
  //   OK                    — revoke applied, jti marked used
  //   FAILED_PRECONDITION   — jti already used (idempotent success; app clears outbox)
  //   UNAUTHENTICATED       — signature invalid or exp in past
  //   RESOURCE_EXHAUSTED    — rate-limited (3 req/sub/min)
}
