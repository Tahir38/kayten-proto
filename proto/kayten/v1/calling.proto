syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

// ── Voice mode contract ─────────────────────────────────────────────────
// Production voice supports two user-selectable modes, both defined in
// the authoritative system solution spec. As of v2026-04-23, wire format
// uses canonical single-character codes (see BREAKING CHANGE note below).
//
//   - "B" / Balanced Mode B (DEFAULT selected product mode):
//       HSM-authenticated call agreement; HSM-derived call-scoped epoch
//       state; native-engine frame crypto using bounded, native-only
//       active-call epoch material (never surfaced to Dart/UI
//       ownership); mandatory zeroization on rotation/teardown.
//       `CallVoiceRekey.epoch_id` carries the authoritative Mode B
//       epochIndex (see that field for the full contract).
//
//   - "A" / Strict Mode A (stricter selectable profile):
//       HSM-authenticated call agreement; per-frame encrypt/decrypt
//       through dedicated HSM frame commands; no plaintext voice key
//       material in Android/app memory; mandatory teardown/zeroization.
//
// Wire semantics of the `voice_mode` string field on `CallOffer` /
// `CallAnswer`:
//   - "B"       → Balanced Mode B
//   - "A"       → Strict Mode A
//   - empty     → invalid / unspecified; production senders MUST set
//                 an explicit mode. Receivers MUST fail closed (send
//                 CALL_HANGUP or equivalent) instead of silently
//                 downgrading to a default or software-only crypto.
//
// BREAKING CHANGE (v2026-04-23): The legacy wire values "mode_a" and "mode_b"
// are no longer accepted as of this commit. Only canonical "A" and "B" are valid.
// Senders using the old format will receive a validation error from the server.
// Update your clients to send canonical values.
//
// Both peers MUST agree on the negotiated mode before the call begins;
// mode is locked at call initiation (before answer) and mid-call mode
// changes are not supported. If negotiation cannot converge on a
// mutually supported mode, the call MUST fail closed.
//
// The server relays `voice_mode`, `voice_ecdh_pub`, `voice_ecdh_sig`,
// DTLS fingerprints, ICE candidates, and rekey metadata opaquely and
// byte-for-byte; it SHALL NOT reinterpret, synthesize, or rewrite any
// of these crypto / negotiation fields.

message CallOffer {
  string conversation_id = 1;
  string sdp_offer = 2;
  string call_type = 3;
  bytes dtls_fingerprint = 4;
  bytes dtls_fingerprint_signature = 5;
  bytes signer_identity_pub = 6;
  bytes voice_ecdh_pub = 7;
  // Selected voice mode for this call; see the "Voice mode contract"
  // docblock at the top of this file. Canonical values: "B" (Balanced
  // Mode B) or "A" (Strict Mode A). Empty is invalid in production.
  string voice_mode = 8;
  // Server-populated TURN credentials for the recipient.
  string turn_username = 9;
  string turn_credential = 10;
  repeated string turn_urls = 11;
  bytes voice_ecdh_sig = 12;       // Ed25519 signature over transcript(callId, conversationId, role, voiceMode, voiceEcdhPub)
}

message CallAnswer {
  string conversation_id = 1;
  string sdp_answer = 2;
  bytes dtls_fingerprint = 3;
  bytes dtls_fingerprint_signature = 4;
  bytes signer_identity_pub = 5;
  bytes voice_ecdh_pub = 6;
  // Selected voice mode for this call; see the "Voice mode contract"
  // docblock at the top of this file. Canonical values: "B" (Balanced
  // Mode B) or "A" (Strict Mode A). Empty is invalid in production.
  string voice_mode = 7;
  // Server-populated TURN credentials for the caller.
  string turn_username = 8;
  string turn_credential = 9;
  repeated string turn_urls = 10;
  bytes voice_ecdh_sig = 11;       // Ed25519 signature over transcript(callId, conversationId, role, voiceMode, voiceEcdhPub)
}

message CallIceCandidate {
  string conversation_id = 1;
  string candidate = 2;
  string sdp_mid = 3;
  int32 sdp_mline_index = 4;
}

message CallHangup {
  string conversation_id = 1;
  string reason = 2;
}

message CallRinging {
  string conversation_id = 1;
}

message CallDtlsFingerprint {
  string conversation_id = 1;
  bytes fingerprint = 2;
  bytes signature = 3;
}

// CallEpochRotate is a coordinated peer-to-peer video epoch rotation signal.
// Per the kayten-app v1 video architecture design §4.3 (rotation tolerance
// window), peers MUST rotate to a new epoch in lockstep — the sender derives
// the new epoch via HSM `0x5D GENERATE_VIDEO_EPOCH_KEY` and signals the new
// epoch_index to the peer; both sides switch within a 2-second overlap window
// where both old and new keys can decrypt frames in flight. Without this
// signaling, peers diverge on rotate timing and frames in flight fail GCM
// auth on the receiver.
//
// Server relay: opaque, byte-for-byte. The server relays this envelope
// verbatim between active call participants and MUST NOT rewrite, synthesize,
// or reorder any field. The server does not inspect or validate the signature
// or epoch_index (no key material is on the wire — see HSM 0x5D contract).
//
// The wire signaling is signed with the sender's Ed25519 identity key over
// the canonical transcript `canonical_encode(conversation_id || call_id ||
// new_epoch_index_LE_4B)` so a man-in-the-middle cannot inject a rotation
// that the keying epoch wouldn't follow.
//
// See `kayten-app/docs/superpowers/reviews/2026-05-09-audit-findings-and-remediation-roadmap.md`
// FIX-5.
message CallEpochRotate {
  // Conversation identifier (matches the conversation that owns the call).
  string conversation_id = 1;

  // Call identifier — the same id used in CallOffer / CallAnswer / CallHangup.
  string call_id = 2;

  // Monotonically advancing epoch index. The peer that receives this
  // envelope rotates its decryptor's expected epoch to this value.
  // The sender derives 0x5D with this index FIRST, then sends the
  // envelope, then switches its encryptor.
  uint32 new_epoch_index = 3;

  // Sender's Ed25519 identity public key, mirroring the
  // CAP_WIRE_IDENTITY_V1 contract on every composite envelope. The
  // receiver's TOFU cache MUST match this against the cached value
  // from the active call's CallOffer / CallAnswer.
  bytes signer_identity_pub = 4;

  // Ed25519(signer_identity_pub, transcript) where transcript =
  // canonical_encode(conversation_id || call_id ||
  // new_epoch_index_LE_4B). Receiver MUST validate before applying
  // the rotation.
  bytes signature = 5;
}

// CallVoiceRekey carries a Balanced Mode B epoch rotation for an active
// call. See the "Voice mode contract" docblock at the top of this file.
// For Strict Mode A this message is unused — Mode A rekey is owned by
// the HSM frame-command family, not by a wire-visible rekey envelope.
//
// Server relay: opaque, byte-for-byte; the server MUST NOT rewrite,
// synthesize, or reorder any rekey field.
message CallVoiceRekey {
  string conversation_id = 1;
  // Peer's rotated ECDH public key for the next Mode B epoch.
  bytes new_ecdh_pub = 2;
  // Authoritative Mode B epoch index for this rotation. Maps directly to
  // the `epochIndex:4B` request field of `0x3B GENERATE_EPOCH_KEY` in
  // the HSM voice contract — full 32-bit unsigned range. The
  // app/Host/HSM stack SHALL treat this as the single authoritative
  // epoch index for the rotation; receivers MUST NOT locally synthesize
  // or re-guess an epoch index when this value is present on the wire.
  //
  // Wire compatibility note: this field was previously declared `int32`.
  // proto3 varint encoding is identical for non-negative values, so any
  // previously-populated value in `[0, 2^31-1]` round-trips unchanged.
  // The `uint32` declaration is the canonical match for the firmware
  // contract and removes the unrepresentable upper half.
  uint32 epoch_id = 3;
}

// ── MoHSM-75: Group voice calls (full-mesh, audio-only V1) ──────────────
//
// Topology: N participants each maintain N-1 PeerConnections (full mesh).
// Per-pair voice ECDH derives a Mode B epoch key independently for each
// pair. Server is a stateless signaling relay (mirrors the 1:1 CALL_*
// pattern); conference membership lives in the participants' WS sessions
// + reconstructs from JOIN / LEAVE events.
//
// Cap: 5 participants enforced client-side; the server enforces nothing
// crypto-relevant on these envelopes.

// GroupCallOffer is the conference initiator's broadcast invite. Server
// fans out to every conversation member except the caller.
message GroupCallOffer {
  string conversation_id = 1;
  string call_id = 2;
  // Caller's user id; receivers display this as the "incoming group
  // call from {caller}" hint. Authoritative routing of the envelope
  // remains the server's job.
  string caller_user_id = 3;
  // Caller's Ed25519 identity pub (CAP_WIRE_IDENTITY_V1 contract; every
  // composite envelope carries the signer pub for the receiver's TOFU
  // cache match). Pair-wise SDP signatures live on GroupCallPeerOffer /
  // GroupCallPeerAnswer; this field authenticates the caller's
  // membership invite itself.
  bytes signer_identity_pub = 4;
}

// GroupCallRinging acknowledges that an invited callee's device is
// ringing the user. Optional — mirrors 1:1 CallRinging. Server fans
// out to every current conference participant.
message GroupCallRinging {
  string conversation_id = 1;
  string call_id = 2;
  string from_user_id = 3;
}

// GroupCallJoin is sent by a callee who has accepted the invite. Server
// fans out to every other current conference participant. On receipt,
// each existing participant initiates a pair-wise GroupCallPeerOffer
// using the tie-breaker rule (lower user_id is initiator).
//
// V1 note: GroupCallJoin does NOT carry a voice_ecdh_pub field. The
// joiner's voice public key is exchanged in the PEER_ANSWER envelope.
// As a result the initiator's PEER_OFFER ships with wrapped_epoch_key
// EMPTY; the epoch is delivered via a follow-up GROUP_CALL_PEER_EPOCH_ROTATE
// after the PEER_ANSWER arrives. V2+ MAY include voice_ecdh_pub on JOIN
// so the initiator can include the wrapped key in the initial PEER_OFFER.
message GroupCallJoin {
  string conversation_id = 1;
  string call_id = 2;
  string joiner_user_id = 3;
}

// GroupCallPeerOffer is a pair-wise WebRTC SDP offer between two
// conference participants. Server routes EXCLUSIVELY to `to_user_id` —
// other participants do NOT receive this envelope.
//
// Voice-key distribution model: the CONFERENCE INITIATOR (the user who
// started the call) generates ONE shared Mode B epoch key for the whole
// conference and distributes it per-callee. Callees do NOT generate their
// own voice keys — they unwrap the shared key from the initiator and load
// it into their HSM voice session, mirroring 1:1 Mode B.
//
// V1 two-phase epoch delivery (initiator → callee):
//   1. Initiator sends PEER_OFFER with `wrapped_epoch_key` EMPTY and
//      `voice_ecdh_pub` carrying the initiator's voice public key. The
//      joiner's voice pub is not yet known at JOIN time (GroupCallJoin
//      carries no voice_ecdh_pub in V1).
//   2. After the PEER_ANSWER arrives (carrying the joiner's voice pub),
//      the initiator wraps the epoch and sends it via a follow-up
//      GROUP_CALL_PEER_EPOCH_ROTATE. V2+ MAY include the wrapped key
//      directly in PEER_OFFER once joiner's voice pub is published on JOIN.
//
// Wire fields by role:
//   * Initiator → Callee:
//       `voice_ecdh_pub`     — initiator's voice public key (64 bytes)
//       `voice_ecdh_sig`     — Ed25519 signature over transcript
//                              (call_id || from_user_id || to_user_id ||
//                               voice_ecdh_pub || wrapped_epoch_key)
//                              NOTE: not yet populated in V1 (C.3.4 gap)
//       `wrapped_epoch_key`  — EMPTY in V1 PEER_OFFER; epoch arrives via
//                              GROUP_CALL_PEER_EPOCH_ROTATE after PEER_ANSWER
//   * Callee ↔ Callee (post-key-distribution SDP-only peer pairs):
//       voice_ecdh_pub / voice_ecdh_sig / wrapped_epoch_key all left
//       EMPTY — both callees already hold the shared epoch key from
//       their respective initiator EPOCH_ROTATE deliveries, so this
//       envelope carries only SDP + ICE coordinates for the audio transport.
message GroupCallPeerOffer {
  string conversation_id = 1;
  string call_id = 2;
  string from_user_id = 3;
  string to_user_id = 4;
  string sdp_offer = 5;
  bytes dtls_fingerprint = 6;
  bytes dtls_fingerprint_signature = 7;
  bytes voice_ecdh_pub = 8;
  bytes voice_ecdh_sig = 9;
  bytes signer_identity_pub = 10;
  // TURN credentials populated by the server for the receiver.
  string turn_username = 11;
  string turn_credential = 12;
  repeated string turn_urls = 13;
  // Conference initiator → callee: EMPTY in the initial V1 PEER_OFFER
  // (joiner's voice pub not yet known at JOIN time). The actual wrapped
  // epoch key is delivered via GROUP_CALL_PEER_EPOCH_ROTATE after the
  // PEER_ANSWER arrives carrying the joiner's voice_ecdh_pub. Always
  // EMPTY on callee↔callee PEER_OFFERs (both sides already hold the
  // shared epoch from their respective initiator EPOCH_ROTATE). See the
  // message docstring above for the full V1 two-phase delivery contract.
  bytes wrapped_epoch_key = 14;
}

// GroupCallPeerAnswer is a pair-wise SDP answer. Server routes
// EXCLUSIVELY to `to_user_id`.
message GroupCallPeerAnswer {
  string conversation_id = 1;
  string call_id = 2;
  string from_user_id = 3;
  string to_user_id = 4;
  string sdp_answer = 5;
  bytes dtls_fingerprint = 6;
  bytes dtls_fingerprint_signature = 7;
  bytes voice_ecdh_pub = 8;
  bytes voice_ecdh_sig = 9;
  bytes signer_identity_pub = 10;
  string turn_username = 11;
  string turn_credential = 12;
  repeated string turn_urls = 13;
}

// GroupCallPeerIceCandidate is a pair-wise ICE candidate. Server routes
// EXCLUSIVELY to `to_user_id`.
message GroupCallPeerIceCandidate {
  string conversation_id = 1;
  string call_id = 2;
  string from_user_id = 3;
  string to_user_id = 4;
  string candidate = 5;
  string sdp_mid = 6;
  int32 sdp_mline_index = 7;
}

// GroupCallLeave indicates a participant has left the conference, either
// gracefully (user pressed hangup), reactively (peer hung up so we
// teardown), or by declining the original invite. Server fans out to
// every other current conference participant.
//
// Canonical reason values (display-string mapping is a client concern):
//   "hangup"      — user explicitly pressed hangup
//   "declined"    — user declined the incoming invite (no JOIN was sent)
//   "cap_reached" — auto-decline because joining would exceed the 5-cap
//   "hsm_disconnect" — HSM detach mid-call (mirrors 1:1 HSM-unplug
//                     CALL_HANGUP from SP-3-Android Task 4)
//   "network"     — peer network gave up
message GroupCallLeave {
  string conversation_id = 1;
  string call_id = 2;
  string leaver_user_id = 3;
  string reason = 4;
}

// GroupCallPeerEpochRotate rotates the shared Mode B voice epoch for
// the conference. ONLY the conference initiator emits this envelope
// (mirrors the voice-key distribution model on GroupCallPeerOffer:
// the initiator is the sole key source). Server routes EXCLUSIVELY
// to `to_user_id`; one envelope per current callee.
//
// The rotation transcript is `canonical_encode(call_id || from_user_id
// || to_user_id || new_epoch_index_LE_4B || wrapped_epoch_key)`. Each
// callee unwraps `wrapped_epoch_key` via ECDH(callee_voice_priv,
// initiator_voice_pub) and loads the new epoch into their HSM voice
// session.
message GroupCallPeerEpochRotate {
  string conversation_id = 1;
  string call_id = 2;
  string from_user_id = 3;
  string to_user_id = 4;
  uint32 new_epoch_index = 5;
  bytes signer_identity_pub = 6;
  bytes signature = 7;
  // Conference initiator's voice public key (for callee's ECDH unwrap).
  // The initiator's voice keypair stays constant across the entire
  // conference; this field exists so a receiver who somehow lost the
  // initiator's voice pub (e.g. session restart mid-call) can still
  // unwrap the new epoch without re-running JOIN.
  bytes voice_ecdh_pub = 8;
  // Shared Mode B epoch key wrapped via ECDH(initiator_voice_priv,
  // callee_voice_pub).
  bytes wrapped_epoch_key = 9;
}
