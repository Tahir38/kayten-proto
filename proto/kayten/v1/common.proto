syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

import "google/protobuf/timestamp.proto";

message DeviceInfo {
  string device_id = 1;
  string device_name = 2;
  string hsm_serial = 3;
  string hsm_firmware_version = 4;
  string platform = 5;
  google.protobuf.Timestamp last_active_at = 6;
  bool is_active = 7;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
}

// Server-advertised capability flags.
//
// Advertised on the `capabilities` field of every `AuthTokenResponse`
// (both `VerifyCode` and `RefreshToken` return paths). Clients MUST
// refuse to boot against a server whose capabilities do not include the
// minimum set required for the client's wire contract. Adding a new
// capability is always additive; retiring one is a breaking change and
// requires a `v2` package cut per the repo's wire-format stability rule.
enum ServerCapability {
  SERVER_CAPABILITY_UNSPECIFIED = 0;

  // Wire-authoritative signer identity. When advertised, the server:
  //   (1) persists and relays `signer_identity_pub` verbatim on every
  //       composite envelope (SendMessage, ReceiveMessage, EditMessage,
  //       GroupSenderKey);
  //   (2) rejects composite envelopes with a missing or non-32-byte
  //       `signer_identity_pub` at ingress (`InvalidArgument`);
  //   (3) exposes strict `DeviceService.GetDeviceIdentityKey` and
  //       per-user `DeviceService.ListUserDevices` and does NOT expose
  //       the retired `GetIdentityKey` RPC.
  // Clients that depend on wire-provided signer identity MUST refuse to
  // run against a server that does not advertise this bit — see
  // `docs/superpowers/plans/2026-04-20-cross-repo-wire-identity-v1-spec.md`.
  SERVER_CAPABILITY_WIRE_IDENTITY_V1 = 1;

  // Identity commit state machine (2026-04-21 HSM identity regeneration
  // spec §3.1 P1-P7). When advertised, the server:
  //   (1) persists `identity_commit_epoch` and `identity_commit_state` on
  //       every RegisterIdentityKey and cross-checks them on rotation;
  //   (2) writes a `device_identity_rotations` audit row for every
  //       rotation accepted under a non-first-commit auth_method;
  //   (3) rejects un-attested rotations with `ErrRotationAuthRequired`
  //       once the per-deploy `graceAcceptLegacy` flag has been flipped
  //       to false (Phase 5 of the spec's rollout plan);
  //   (4) exposes `LinkingAttestation`-based rotation and
  //       `account_recovery_token` bypass paths per §4.7.
  // Clients that depend on epoch-level identity pinning MUST refuse to
  // boot against a server that does not advertise this bit — see
  // `docs/superpowers/plans/2026-04-21-hsm-identity-regeneration-bug-report-and-fix-spec.md`.
  SERVER_CAPABILITY_IDENTITY_COMMIT_V1 = 2;

  // Identity registration proof v1 (2026-04-24 cross-repo identity
  // production readiness plan, WP1/WP4). When advertised, the server:
  //   (1) issues a single-use 32-byte `server_nonce` via
  //       `DeviceService.RequestIdentityRegistrationNonce` bound to the
  //       authenticated user/device/phone_binding;
  //   (2) requires `RegisterIdentityKeyRequest.proof` on every first
  //       commit, no-rotation reinstall, and rotation, and verifies the
  //       Ed25519 signature over the canonical transcript (see
  //       `docs/canonical-transcript-encoder-v1.md`);
  //   (3) rejects `RegisterIdentityKeyRequest` whose duplicated
  //       top-level fields disagree with the signed `proof` fields;
  //   (4) maintains a user-level identity lineage and a monotonic
  //       `server_identity_version` so HSM-replacement flows that
  //       reset the firmware epoch to 1 still monotonically advance
  //       the server-side counter;
  //   (5) fails closed on prekey uploads without a trusted identity
  //       and on unsigned/invalid-signature prekeys.
  // Clients that require proof-backed registration MUST refuse to boot
  // against a server that does not advertise this bit. Servers with
  // `grace_accept_legacy_rotations=true` MAY advertise this bit only in
  // dev/staging environments.
  SERVER_CAPABILITY_IDENTITY_PROOF_V1 = 3;

  // Backend dev-reset marker v1 (2026-04-24 plan WP9). When advertised,
  // the server:
  //   (1) publishes a `BackendResetState` via the unauthenticated
  //       `SystemService.GetBackendResetState` RPC (see
  //       `kayten/v1/system.proto`) — and/or on auth-failure metadata —
  //       after a `KAYTEN_DEV_RESET_ON_STARTUP=true` boot;
  //   (2) guarantees the reset marker is NOT stored only in Postgres or
  //       Redis (both are wiped by the reset-on-startup flow);
  //   (3) returns `environment="prod"`, `reset_on_startup_enabled=false`,
  //       empty `identity_dev_reset_generation`, and
  //       `identity_dev_reset_epoch=0` in production — production
  //       startup hard-fails rather than running reset.
  // Clients use the marker to clear local trust/session/history state
  // after a dev backend wipe, without production code ever accepting
  // dev-reset as an identity-rotation authorization method.
  SERVER_CAPABILITY_BACKEND_RESET_STATE_V1 = 4;

  // Encrypted video calling v1 (2026-05-09 cross-repo video expansion
  // master plan, Step 9 Phase 2). When advertised, the server:
  //   (1) accepts `CallOffer.call_type = "video"` from clients that
  //       advertise the same capability and relays the offer to the
  //       receiver verbatim;
  //   (2) rejects `OfferCall` RPC with `FailedPrecondition
  //       "video_unsupported_by_recipient"` when the called device is
  //       known to lack `CAP_CALL_VIDEO_V1`. (Today this is approximated
  //       via `client_minor_version` on the most-recent RegisterIdentityKey
  //       request; a per-device capability column may replace it later.);
  //   (3) relays a future `CALL_EPOCH_ROTATE` envelope between active
  //       call peers without inspecting its contents (key material is
  //       not present on the wire — see HSM 0x5D contract).
  // Clients MUST gate the chat-screen video-call button behind this
  // capability and MUST NOT silently downgrade a video offer to voice
  // when the peer lacks it. See
  // `docs/superpowers/plans/2026-05-09-cross-repo-video-expansion-contract.md` §1.5.
  SERVER_CAPABILITY_CALL_VIDEO_V1 = 5;
}

// Dev-reset marker advertised by the server after a
// `KAYTEN_DEV_RESET_ON_STARTUP=true` boot (2026-04-24 cross-repo plan
// WP9). Populated on the unauthenticated bootstrap/config endpoint and
// echoed on auth-failure metadata so the app can detect "backend was
// wiped" before attempting authenticated session restore.
//
// Production posture: the server MUST return `environment="prod"`,
// `reset_on_startup_enabled=false`, empty
// `identity_dev_reset_generation`, `identity_dev_reset_epoch=0`. Any
// other value in production is a wire-level error — the app treats it
// as a hostile server and refuses to run. The server also MUST hard
// fail startup when `KAYTEN_DEV_RESET_ON_STARTUP=true` is combined
// with a production-posture `KAYTEN_ENV`.
//
// Storage rule: the reset marker MUST NOT live only in Postgres or
// Redis, because both are wiped by the reset-on-startup flow. An
// in-memory marker valid for the reset-boot lifetime is sufficient
// for the current Portainer/Docker dev workflow. Operators who need
// the marker to survive a later restart with
// `KAYTEN_DEV_RESET_ON_STARTUP=false` MUST persist it to a
// config-mounted file outside Postgres/Redis.
message BackendResetState {
  // Server environment. Exactly one of: `development`, `dev`, `local`,
  // `test`, `staging`, `prod`. Production builds MUST return `prod`.
  // Clients MUST treat any value other than the four dev/test variants
  // as production and ignore reset advisories.
  string environment = 1;

  // Monotonic reset counter for this backend base URL. Increments on
  // every reset-on-startup boot. Production returns 0. The app
  // compares this against its last-seen value for the same base URL
  // and clears local state on strictly-greater.
  uint64 identity_dev_reset_epoch = 2;

  // UUID generated for this reset boot. Used when epoch persistence
  // across reset boots is not available (the default for the
  // Portainer in-memory marker). Production returns "". The app
  // compares this against its last-seen value for the same base URL
  // and clears local state on string inequality.
  string identity_dev_reset_generation = 3;

  // Millisecond Unix timestamp of this reset boot. Production returns 0.
  int64 reset_at_unix_ms = 4;

  // Free-form reason string. The server sets "reset_on_startup" for
  // the Portainer flow; future live-reset endpoints may use different
  // values. Production returns "".
  string reset_reason = 5;

  // True only on a reset boot where `KAYTEN_DEV_RESET_ON_STARTUP=true`
  // was honored. False on all other boots, including non-dev
  // environments and dev boots without the flag. Production MUST
  // return false.
  bool reset_on_startup_enabled = 6;
}
