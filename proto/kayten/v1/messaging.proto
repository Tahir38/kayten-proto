syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

import "google/protobuf/timestamp.proto";
import "kayten/v1/calling.proto";

// Envelope wraps all WebSocket messages between client and server.
message Envelope {
  // Reserved: oneof payload fields for the obsolete polling-based
  // KEY_EXCHANGE_REQUEST / KEY_EXCHANGE_RESPONSE bootstrap flow
  // (cross-repo-production-spec-v1 §3.1). First-message bootstrap now
  // travels in SendMessage.prekey_bootstrap.
  reserved 30, 31;
  reserved "key_exchange_request", "key_exchange_response";

  EnvelopeType type = 1;
  string id = 2;
  google.protobuf.Timestamp timestamp = 3;

  oneof payload {
    SendMessage send_message = 10;
    ReceiveMessage receive_message = 11;
    MessageAck message_ack = 12;
    DeliveryReceipt delivery_receipt = 13;
    ReadReceipt read_receipt = 14;
    TypingIndicator typing_indicator = 15;
    CallOffer call_offer = 20;
    CallAnswer call_answer = 21;
    CallIceCandidate call_ice_candidate = 22;
    CallHangup call_hangup = 23;
    CallRinging call_ringing = 24;
    CallDtlsFingerprint call_dtls_fingerprint = 25;
    CallVoiceRekey call_voice_rekey = 26;
    KeyRatchetNotify key_ratchet_notify = 32;
    KeyChangeAlert key_change_alert = 33;
    PresenceUpdate presence_update = 40;
    SyncRequest sync_request = 50;
    SyncResponse sync_response = 51;
    WsAuthRequest ws_auth_request = 60;
    WsAuthResponse ws_auth_response = 61;
    OpkReplenishNeeded opk_replenish_needed = 62;
    DeviceRevoked device_revoked = 70;
    GroupSenderKey group_sender_key = 80;
    GroupMemberEvent group_member_event = 81;
    EditMessage edit_message = 82;
    DeleteMessage delete_message = 83;
    AddReaction add_reaction = 84;
    RemoveReaction remove_reaction = 85;
    MessageEvent message_event = 86;
    SetConversationTtl set_conversation_ttl = 87;
    ErrorPayload error_payload = 99;
  }
}

enum EnvelopeType {
  // Reserved: the obsolete polling-based bootstrap envelope types.
  // First-message bootstrap now travels in SendMessage.prekey_bootstrap
  // (cross-repo-production-spec-v1 §3.1).
  reserved 20, 21;
  reserved "KEY_EXCHANGE_REQUEST", "KEY_EXCHANGE_RESPONSE";

  ENVELOPE_TYPE_UNSPECIFIED = 0;
  SEND_MESSAGE = 1;
  RECEIVE_MESSAGE = 2;
  MESSAGE_ACK = 3;
  DELIVERY_RECEIPT = 4;
  READ_RECEIPT = 5;
  TYPING_INDICATOR = 6;
  CALL_OFFER = 10;
  CALL_ANSWER = 11;
  CALL_ICE_CANDIDATE = 12;
  CALL_HANGUP = 13;
  CALL_RINGING = 14;
  CALL_DTLS_FINGERPRINT = 15;
  CALL_VOICE_REKEY = 16;
  KEY_RATCHET_NOTIFY = 22;
  KEY_CHANGE_ALERT = 23;
  GROUP_SENDER_KEY = 24;
  GROUP_MEMBER_EVENT = 25;
  EDIT_MESSAGE = 26;
  DELETE_MESSAGE = 27;
  ADD_REACTION = 28;
  REMOVE_REACTION = 29;
  SET_CONVERSATION_TTL = 35;
  PRESENCE_UPDATE = 30;
  SYNC_REQUEST = 40;
  SYNC_RESPONSE = 41;
  DEVICE_ATTESTATION_CHALLENGE = 50;
  DEVICE_REVOKED = 51;
  WS_AUTH_REQUEST = 60;
  WS_AUTH_RESPONSE = 61;
  OPK_REPLENISH_NEEDED = 62;
  ERROR = 99;
}

// PrekeyBootstrap carries the metadata a responder needs to derive a fresh
// Double Ratchet session from the very first message in a conversation,
// without requiring a prior KEY_EXCHANGE_REQUEST round-trip.
//
// When a SendMessage envelope includes this field, the responder treats the
// message as a prekey-bootstrap and derives initial state from these fields
// before decrypting `ciphertext`.
//
// The server relays this field transparently — it does NOT validate or
// inspect any contents.
message PrekeyBootstrap {
  // Initiator's ephemeral ECDH public key.
  bytes initiator_ephemeral = 1;

  // Initiator's Ed25519 identity public key.
  bytes initiator_identity_pub = 2;

  // Identifier of the consumed one-time prekey, if any. 0 = no OPK.
  uint32 consumed_opk_id = 3;

  // Identifier of the signed prekey used for X3DH (for ratchet binding).
  uint32 signed_prekey_id = 4;

  // Optional sender device id, in case the message router needs it before
  // the responder has a contact entry.
  string sender_device_id = 5;
}

message SendMessage {
  string conversation_id = 1;
  string recipient_id = 2;
  string recipient_device_id = 3;

  // Encrypted message body. Populated by both legacy and composite paths.
  bytes ciphertext = 4;

  // ── Legacy / transition fields ──────────────────────────────────────
  // These fields carry the pre-composite (single-IV, single/dual-tag)
  // crypto shape. They remain for backward compatibility with clients
  // that have not yet adopted the 0x40 ENCRYPT_AND_SIGN_MSG composite
  // runtime path.
  //
  // Sender rules during rollout:
  //   - Legacy-only senders MAY continue populating only legacy fields.
  //   - Composite-capable senders SHOULD dual-write both canonical
  //     composite fields and legacy compatibility fields.
  //   - Senders SHALL NOT populate conflicting values across legacy
  //     and composite fields.
  //
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".
  //
  // The server relays these fields transparently and does not interpret
  // the crypto payload.

  // Legacy single IV (pre-composite compatibility).
  bytes iv = 5;
  // Legacy single authentication tag (pre-composite compatibility).
  bytes tag = 6;

  // Ed25519 signature over the message envelope. Populated by both
  // legacy and composite paths.
  bytes signature = 7;

  string msg_type = 8;
  int32 padded_size = 9;
  bytes ratchet_pub = 10;
  int32 ratchet_seq = 11;
  // Reply threading: ID of the message being replied to.
  string reply_to_message_id = 12;
  int32 ttl_seconds = 13;
  bool is_view_once = 14;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility).
  bytes tag_inner = 15;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path.
  bytes tag_outer = 16;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // These fields carry the composite crypto shape returned by the HSM
  // ENCRYPT_AND_SIGN_MSG path. Composite-capable senders populate:
  //   ciphertext, iv_inner, iv_outer, tag_outer, signature
  //
  // Receiver precedence:
  //   1. If iv_inner / iv_outer are populated, receivers SHALL prefer
  //      them (composite path).
  //   2. Otherwise receivers SHALL fall back to legacy `iv`.
  //   3. Receivers SHALL NOT ignore populated composite fields and
  //      silently prefer legacy fields.

  // Inner AES-GCM IV (composite runtime).
  bytes iv_inner = 17;
  // Outer AES-GCM IV (composite runtime).
  bytes iv_outer = 18;

  // Optional prekey bootstrap metadata. When present, this is the first
  // message in a new conversation and the responder MUST derive session
  // state from these fields before decrypting `ciphertext`.
  // Server relays this field transparently.
  PrekeyBootstrap prekey_bootstrap = 20;
}

message ReceiveMessage {
  string message_id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string sender_device_id = 4;

  // Encrypted message body. Populated by both legacy and composite paths.
  bytes ciphertext = 5;

  // ── Legacy / transition fields ──────────────────────────────────────
  // These fields carry the pre-composite (single-IV, single/dual-tag)
  // crypto shape. They remain for backward compatibility with clients
  // that have not yet adopted the 0x40 ENCRYPT_AND_SIGN_MSG composite
  // runtime path.
  //
  // Sender rules during rollout:
  //   - Legacy-only senders MAY continue populating only legacy fields.
  //   - Composite-capable senders SHOULD dual-write both canonical
  //     composite fields and legacy compatibility fields.
  //   - Senders SHALL NOT populate conflicting values across legacy
  //     and composite fields.
  //
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".
  //
  // The server relays these fields transparently and does not interpret
  // the crypto payload.

  // Legacy single IV (pre-composite compatibility).
  bytes iv = 6;
  // Legacy single authentication tag (pre-composite compatibility).
  bytes tag = 7;

  // Ed25519 signature over the message envelope. Populated by both
  // legacy and composite paths.
  bytes signature = 8;

  string msg_type = 9;
  int32 padded_size = 10;
  bytes ratchet_pub = 11;
  int32 ratchet_seq = 12;
  int64 server_seq = 13;
  google.protobuf.Timestamp server_timestamp = 14;
  // WP-BE-01/02: Message mutation and lifecycle fields
  string reply_to_message_id = 15;
  int32 edit_seq = 16;
  bool is_deleted_for_everyone = 17;
  int32 ttl_seconds = 18;
  bool is_view_once = 19;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility).
  bytes tag_inner = 20;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path.
  bytes tag_outer = 21;

  // Mirrors SendMessage.prekey_bootstrap. Present when this message is the
  // first in a conversation and the responder must derive session state
  // from the bootstrap before decrypting `ciphertext`.
  PrekeyBootstrap prekey_bootstrap = 22;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // These fields carry the composite crypto shape returned by the HSM
  // ENCRYPT_AND_SIGN_MSG path. Composite-capable senders populate:
  //   ciphertext, iv_inner, iv_outer, tag_outer, signature
  //
  // Receiver precedence:
  //   1. If iv_inner / iv_outer are populated, receivers SHALL prefer
  //      them (composite path).
  //   2. Otherwise receivers SHALL fall back to legacy `iv`.
  //   3. Receivers SHALL NOT ignore populated composite fields and
  //      silently prefer legacy fields.

  // Inner AES-GCM IV (composite runtime).
  bytes iv_inner = 23;
  // Outer AES-GCM IV (composite runtime).
  bytes iv_outer = 24;
}

message MessageAck {
  string message_id = 1;
  int64 server_seq = 2;
}

message DeliveryReceipt {
  string message_id = 1;
  google.protobuf.Timestamp delivered_at = 2;
}

message ReadReceipt {
  string message_id = 1;
  google.protobuf.Timestamp read_at = 2;
}

message TypingIndicator {
  string conversation_id = 1;
  bool is_typing = 2;
}

// KeyExchangeRequest and KeyExchangeResponse have been removed — the old
// polling-based bootstrap flow is superseded by SendMessage.prekey_bootstrap
// (cross-repo-production-spec-v1 §3.1). Their Envelope oneof field numbers
// (30, 31) and EnvelopeType enum values (20, 21) are reserved above.

message KeyRatchetNotify {
  string conversation_id = 1;
  bytes new_ratchet_pub = 2;
  int32 ratchet_seq = 3;
}

message KeyChangeAlert {
  string device_id = 1;
  string reason = 2;
}

message PresenceUpdate {
  string user_id = 1;
  bool online = 2;
  google.protobuf.Timestamp last_seen = 3;
}

message SyncRequest {
  int64 last_server_seq = 1;
  // Last event server_seq the client has seen (0 = first sync, return all events).
  int64 last_event_seq = 2;
}

message SyncResponse {
  repeated ReceiveMessage messages = 1;
  bool has_more = 2;
  // Event-append sync: mutations on old messages (edits, deletes, reactions)
  repeated MessageEvent events = 3;
}

message WsAuthRequest {
  bytes challenge = 1;
}

message WsAuthResponse {
  string jwt = 1;
  string device_id = 2;
  int32 protocol_version = 3;
  int64 last_server_seq = 4;
  string status = 5;
  int64 server_time = 6;
  string error_code = 7;
  // Ed25519 signature over (challenge || device_id) using the registered device identity key.
  // When present, the server verifies possession of the device private key.
  // When absent (legacy clients), the server falls back to JWT-only auth.
  bytes challenge_signature = 8;
}

message OpkReplenishNeeded {
  int32 remaining_count = 1;
  int32 recommended_upload = 2;
}

message DeviceRevoked {
  string device_id = 1;
  string reason = 2;
}

// GroupSenderKey carries a per-recipient, ratchet-protected distribution
// of a group sender-key seed to one member of a group conversation.
//
// Under the SKDM model (group-file-skdm-cross-repo-spec-v1 §2.1), the
// sender serializes an SkdmPayload, encrypts it through the existing
// 1:1 ratchet session to the target recipient, and carries the resulting
// ciphertext + ratchet metadata in this envelope. The server relays the
// envelope unmodified — it never sees sender-key material in plaintext.
//
// This message is NOT a device-bound wrapped key blob. The pre-SKDM
// `sender_key = 2` field has been removed; its field number is reserved
// to prevent reuse.
message GroupSenderKey {
  // Group conversation this sender key belongs to.
  string conversation_id = 1;

  // Reserved: the pre-SKDM `sender_key` blob (device-bound wrapped key
  // transport). Removed per group-file-skdm-cross-repo-spec-v1 §2.1.
  reserved 2;
  reserved "sender_key";

  // Single recipient of this per-member fanout envelope. The sender
  // emits one GroupSenderKey envelope per target member, each encrypted
  // through the 1:1 session to that member.
  string target_user_id = 3;

  // Sender identity — carried in plaintext at the envelope layer so the
  // recipient can look up the correct 1:1 ratchet session before
  // attempting to decrypt `ciphertext`.
  string sender_user_id = 4;
  string sender_device_id = 5;

  // 1:1-session ciphertext of the serialized SkdmPayload for this
  // recipient. Decrypted with the recipient's existing ratchet state
  // against `sender_user_id`/`sender_device_id`.
  bytes ciphertext = 6;

  // ── Legacy / transition fields ──────────────────────────────────────
  // These fields carry the pre-composite (single-IV) crypto shape for
  // the 1:1 ratchet protection of the SKDM distribution. They remain
  // for backward compatibility with clients that have not yet adopted
  // the composite runtime path.
  //
  // Sender rules during rollout:
  //   - Legacy-only senders MAY continue populating only legacy fields.
  //   - Composite-capable senders SHOULD dual-write both canonical
  //     composite fields and legacy compatibility fields if older
  //     recipients still exist.
  //   - Senders SHALL NOT populate conflicting values across legacy
  //     and composite fields.
  //
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".

  // Legacy single IV for the 1:1 SKDM encryption (pre-composite compatibility).
  bytes iv = 7;

  // Ed25519 signature over the distribution envelope, verifiable
  // against the sender's registered identity key. Populated by both
  // legacy and composite paths.
  bytes signature = 8;

  // Ratchet metadata required to advance the recipient's 1:1 ratchet
  // state and decrypt `ciphertext`.
  bytes ratchet_pub = 9;
  int32 ratchet_seq = 10;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility).
  bytes tag_inner = 11;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path.
  bytes tag_outer = 12;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // These fields carry the composite crypto shape for the 1:1-protected
  // SKDM distribution. Composite-capable senders populate:
  //   ciphertext, iv_inner, iv_outer, tag_outer, signature
  //
  // Receiver precedence:
  //   1. If iv_inner / iv_outer are populated, receivers SHALL prefer
  //      them (composite path).
  //   2. Otherwise receivers SHALL fall back to legacy `iv`.
  //   3. Receivers SHALL NOT ignore populated composite fields and
  //      silently prefer legacy fields.

  // Inner AES-GCM IV (composite runtime).
  bytes iv_inner = 13;
  // Outer AES-GCM IV (composite runtime).
  bytes iv_outer = 14;
}

// SkdmPayload is the plaintext carried inside GroupSenderKey.ciphertext.
// It is never sent on the wire unencrypted — it is serialized, then
// encrypted through the sender's 1:1 ratchet session to each recipient,
// and the resulting bytes are carried in GroupSenderKey.ciphertext.
//
// The seeds are raw key material the recipient stores locally (for
// example via wrap_storage_root_key) and uses as HKDF input for the
// group ratchet chains that decrypt subsequent group messages from this
// sender on this chain.
message SkdmPayload {
  // Group conversation this sender key belongs to.
  string conversation_id = 1;

  // Monotonically increasing chain id. A sender rotates chain_id when
  // starting a new group sender-key chain (for example after a group
  // membership change or a forced rekey).
  uint32 chain_id = 2;

  // Inner seed — exactly 32 bytes. Protobuf cannot enforce the exact
  // length at the schema level; the application layer MUST validate
  // `len(inner_seed) == 32` before use.
  bytes inner_seed = 3;

  // Outer seed — exactly 32 bytes. Protobuf cannot enforce the exact
  // length at the schema level; the application layer MUST validate
  // `len(outer_seed) == 32` before use.
  bytes outer_seed = 4;

  // Sender's Ed25519 identity public key, echoed so the recipient can
  // bind the seeds to the expected signing identity independently of
  // the transport-layer 1:1 session lookup.
  bytes signing_pub = 5;
}

message GroupMemberEvent {
  string conversation_id = 1;
  string user_id = 2;
  string event_type = 3;        // "joined" or "left"
  string display_name = 4;
  google.protobuf.Timestamp timestamp = 5;
}

// Edit a previously sent message. Requires new ciphertext (ratchet advance).
//
// Rollout behavior:
//   - Legacy-only senders MAY populate only legacy fields and MAY leave
//     `new_signature` empty.
//   - Composite-capable senders MUST populate:
//       new_ciphertext, new_iv_inner, new_iv_outer, new_tag_outer,
//       new_signature
//     and SHOULD also dual-write legacy compatibility fields.
//   - Senders SHALL NOT populate conflicting values across legacy
//     and composite fields.
//   - Receivers MUST treat an edit as composite when `new_iv_inner`
//     and `new_iv_outer` are both populated.
//   - Composite edit receivers MUST require `new_signature`. If
//     composite fields are present but `new_signature` is empty,
//     malformed, or fails verification, receivers MUST reject the edit.
//   - Receivers SHALL NOT ignore populated composite fields and
//     silently prefer legacy fields.
//
// Hardened edit replay contract:
//   - An edit does NOT advance the hardened local-history replay chain.
//   - On historical reopen, receivers MUST replay the edit using the
//     original message row's replay coordinates (ratchet_pub / ratchet_seq
//     captured at the time the original message was first decrypted).
//   - `new_ratchet_pub` / `new_ratchet_seq` on this message are legacy
//     compatibility data and are NOT authoritative replay metadata for
//     hardened historical reopen.
//   - If product later requires edit-specific authoritative replay
//     coordinates (e.g. `edit_ratchet_epoch`, `edit_message_counter`),
//     that is a separate additive proto delta — it is intentionally
//     NOT included here.
//
// The server relays these fields transparently and does not interpret
// the crypto payload.
message EditMessage {
  string message_id = 1;
  string conversation_id = 2;

  // Encrypted replacement body. Populated by both legacy and composite paths.
  bytes new_ciphertext = 3;

  // ── Legacy / transition fields ──────────────────────────────────────
  // Pre-composite crypto shape. Kept for backward compatibility.
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".

  // Legacy single IV (pre-composite compatibility).
  bytes new_iv = 4;
  // Legacy single authentication tag (pre-composite compatibility).
  bytes new_tag = 5;

  int32 edit_seq = 6;

  // Legacy compatibility ratchet coordinates. These are NOT authoritative
  // replay metadata for hardened historical reopen — hardened edit replay
  // reuses the original message row's ratchet coordinates captured when
  // the original message was first decrypted. See the message-level
  // "Hardened edit replay contract" comment above.
  bytes new_ratchet_pub = 7;
  int32 new_ratchet_seq = 8;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility, 16 bytes).
  bytes new_tag_inner = 9;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path (16 bytes).
  bytes new_tag_outer = 10;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // Composite-capable senders MUST populate:
  //   new_ciphertext, new_iv_inner, new_iv_outer, new_tag_outer,
  //   new_signature

  // Inner AES-GCM IV (composite runtime).
  bytes new_iv_inner = 11;
  // Outer AES-GCM IV (composite runtime).
  bytes new_iv_outer = 12;
  // Ed25519 signature over the canonical composite edit transcript.
  // This is NOT an arbitrary repo-local signature; senders MUST sign
  // the following transcript in this exact order:
  //
  //   1. domain prefix: ASCII "kayten-edit-v1"
  //   2. message_id
  //   3. conversation_id
  //   4. edit_seq
  //   5. new_ratchet_seq
  //   6. new_ciphertext
  //   7. new_iv_inner
  //   8. new_iv_outer
  //   9. new_tag_outer
  //
  // Composite edit receivers MUST require this field and verify it
  // against the reconstructed transcript using the sender's registered
  // Ed25519 identity key. If it is empty, malformed, or fails
  // verification the edit MUST be rejected.
  // Legacy edit senders MAY leave this field empty.
  bytes new_signature = 13;
}

// Delete a message for all participants.
message DeleteMessage {
  string message_id = 1;
  string conversation_id = 2;
}

// Add a reaction to a message.
message AddReaction {
  string message_id = 1;
  string conversation_id = 2;
  string reaction = 3;  // Unicode emoji, max 16 bytes
}

// Remove a reaction from a message.
message RemoveReaction {
  string message_id = 1;
  string conversation_id = 2;
  string reaction = 3;
}

// A mutation event on an existing message (for event-append sync).
message MessageEvent {
  string event_id = 1;
  string message_id = 2;
  string conversation_id = 3;
  string event_type = 4;     // "edit", "delete", "add_reaction", "remove_reaction"
  string actor_id = 5;
  int64 server_seq = 6;
  google.protobuf.Timestamp created_at = 7;
  // Payload varies by event_type:
  // edit: new_ciphertext, new_iv, new_tag, edit_seq
  // delete: (empty)
  // add_reaction/remove_reaction: reaction string
  bytes payload_data = 8;
}

message SetConversationTtl {
  string conversation_id = 1;
  int32 ttl_seconds = 2;  // 0 = disabled
}

message ErrorPayload {
  int32 code = 1;
  string message = 2;
}
