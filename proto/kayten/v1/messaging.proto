syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

import "google/protobuf/timestamp.proto";
import "kayten/v1/calling.proto";

// Envelope wraps all WebSocket messages between client and server.
message Envelope {
  // Reserved: oneof payload fields for the obsolete polling-based
  // KEY_EXCHANGE_REQUEST / KEY_EXCHANGE_RESPONSE bootstrap flow
  // (cross-repo-production-spec-v1 §3.1). First-message bootstrap now
  // travels in SendMessage.prekey_bootstrap.
  reserved 30, 31;
  reserved "key_exchange_request", "key_exchange_response";

  EnvelopeType type = 1;
  string id = 2;
  google.protobuf.Timestamp timestamp = 3;

  oneof payload {
    SendMessage send_message = 10;
    ReceiveMessage receive_message = 11;
    MessageAck message_ack = 12;
    DeliveryReceipt delivery_receipt = 13;
    ReadReceipt read_receipt = 14;
    TypingIndicator typing_indicator = 15;
    CallOffer call_offer = 20;
    CallAnswer call_answer = 21;
    CallIceCandidate call_ice_candidate = 22;
    CallHangup call_hangup = 23;
    CallRinging call_ringing = 24;
    CallDtlsFingerprint call_dtls_fingerprint = 25;
    CallVoiceRekey call_voice_rekey = 26;
    CallEpochRotate call_epoch_rotate = 27;
    KeyRatchetNotify key_ratchet_notify = 32;
    KeyChangeAlert key_change_alert = 33;
    PresenceUpdate presence_update = 40;
    ProfileUpdate profile_update = 41;
    SyncRequest sync_request = 50;
    SyncResponse sync_response = 51;
    WsAuthRequest ws_auth_request = 60;
    WsAuthResponse ws_auth_response = 61;
    OpkReplenishNeeded opk_replenish_needed = 62;
    DeviceRevoked device_revoked = 70;
    GroupSenderKey group_sender_key = 80;
    GroupMemberEvent group_member_event = 81;
    EditMessage edit_message = 82;
    DeleteMessage delete_message = 83;
    AddReaction add_reaction = 84;
    RemoveReaction remove_reaction = 85;
    MessageEvent message_event = 86;
    SetConversationTtl set_conversation_ttl = 87;
    PinMessage pin_message = 88;
    UnpinMessage unpin_message = 89;
    GroupCallOffer group_call_offer = 90;
    GroupCallRinging group_call_ringing = 91;
    GroupCallJoin group_call_join = 92;
    GroupCallPeerOffer group_call_peer_offer = 93;
    GroupCallPeerAnswer group_call_peer_answer = 94;
    GroupCallPeerIceCandidate group_call_peer_ice_candidate = 95;
    GroupCallLeave group_call_leave = 96;
    GroupCallPeerEpochRotate group_call_peer_epoch_rotate = 97;
    ErrorPayload error_payload = 99;
  }
}

enum EnvelopeType {
  // Reserved: the obsolete polling-based bootstrap envelope types.
  // First-message bootstrap now travels in SendMessage.prekey_bootstrap
  // (cross-repo-production-spec-v1 §3.1).
  reserved 20, 21;
  reserved "KEY_EXCHANGE_REQUEST", "KEY_EXCHANGE_RESPONSE";

  ENVELOPE_TYPE_UNSPECIFIED = 0;
  SEND_MESSAGE = 1;
  RECEIVE_MESSAGE = 2;
  MESSAGE_ACK = 3;
  DELIVERY_RECEIPT = 4;
  READ_RECEIPT = 5;
  TYPING_INDICATOR = 6;
  CALL_OFFER = 10;
  CALL_ANSWER = 11;
  CALL_ICE_CANDIDATE = 12;
  CALL_HANGUP = 13;
  CALL_RINGING = 14;
  CALL_DTLS_FINGERPRINT = 15;
  CALL_VOICE_REKEY = 16;
  CALL_EPOCH_ROTATE = 17;
  KEY_RATCHET_NOTIFY = 22;
  KEY_CHANGE_ALERT = 23;
  GROUP_SENDER_KEY = 24;
  GROUP_MEMBER_EVENT = 25;
  EDIT_MESSAGE = 26;
  DELETE_MESSAGE = 27;
  ADD_REACTION = 28;
  REMOVE_REACTION = 29;
  SET_CONVERSATION_TTL = 35;
  // MoHSM-73 — WhatsApp-style message pinning. Per-conversation soft
  // pin (server relays the envelope to peers + other devices; pinned
  // state is mirrored locally on each device). Pin cap enforced
  // client-side: 1 for 1:1 conversations, 3 for groups (WhatsApp
  // parity). Newer pin replaces oldest when the cap is reached.
  PIN_MESSAGE = 36;
  UNPIN_MESSAGE = 37;
  // MoHSM-75 — Group voice calls (full-mesh, 5-cap, audio-only V1).
  // Broadcast envelopes 42-44; pair-wise envelopes 52-56.
  // Numeric gap at 45-51 is intentional: 50 = DEVICE_ATTESTATION_CHALLENGE,
  // 51 = DEVICE_REVOKED are pre-existing and would have been a collision
  // under the original 45-52 spec block.
  GROUP_CALL_OFFER = 42;
  GROUP_CALL_RINGING = 43;
  GROUP_CALL_JOIN = 44;
  GROUP_CALL_PEER_OFFER = 52;
  GROUP_CALL_PEER_ANSWER = 53;
  GROUP_CALL_PEER_ICE_CANDIDATE = 54;
  GROUP_CALL_LEAVE = 55;
  GROUP_CALL_PEER_EPOCH_ROTATE = 56;
  PRESENCE_UPDATE = 30;
  PROFILE_UPDATE = 31;
  SYNC_REQUEST = 40;
  SYNC_RESPONSE = 41;
  DEVICE_ATTESTATION_CHALLENGE = 50;
  DEVICE_REVOKED = 51;
  WS_AUTH_REQUEST = 60;
  WS_AUTH_RESPONSE = 61;
  OPK_REPLENISH_NEEDED = 62;
  ERROR = 99;
}

// PrekeyBootstrap carries the metadata a responder needs to derive a fresh
// Double Ratchet session from the very first message in a conversation,
// without requiring a prior KEY_EXCHANGE_REQUEST round-trip.
//
// When a SendMessage envelope includes this field, the responder treats the
// message as a prekey-bootstrap and derives initial state from these fields
// before decrypting `ciphertext`.
//
// The server relays this field transparently — it does NOT validate or
// inspect any contents.
message PrekeyBootstrap {
  // Initiator's ephemeral ECDH public key.
  bytes initiator_ephemeral = 1;

  // Initiator's Ed25519 identity public key.
  bytes initiator_identity_pub = 2;

  // Identifier of the consumed one-time prekey, if any. 0 = no OPK.
  uint32 consumed_opk_id = 3;

  // Identifier of the signed prekey used for X3DH (for ratchet binding).
  uint32 signed_prekey_id = 4;

  // Optional sender device id, in case the message router needs it before
  // the responder has a contact entry.
  string sender_device_id = 5;
}

// ── Canonical composite messaging contract ─────────────────────────────
// The following contract applies to both `SendMessage` and
// `ReceiveMessage` composite-path fields and is the only production
// interpretation.
//
// Canonical composite signature transcript (the bytes `signature` MUST
// cover, reconstructed identically by sender and receiver):
//
//   transcript = SHA-256( iv_inner || ciphertext || tag_outer || aad )
//   signature  = Ed25519(sender_identity_priv, transcript)
//
// Canonical messaging AAD — frozen, versioned, shared by sender and
// receiver. Receivers MUST reconstruct AAD using exactly the same inputs
// and MUST NOT treat AAD shape as repo-local guesswork:
//
//   aad      = SHA-256(preimage)
//   preimage = utf8(conversation_id)
//           || utf8(sender_device_id)
//           || msg_type_byte:u8
//           || ratchet_seq:u32_be
//           || utf8("kayten-msg-aad-v1")
//
// `msg_type_byte:u8` is exactly one byte. It is NOT the UTF-8 of the
// `string msg_type` wire field; the wire string is product/display
// metadata, while AAD is bound to the canonical single-byte code
// frozen below. This table is the authoritative, frozen proto contract
// for the AAD byte under "kayten-msg-aad-v1". It MIRRORS the existing
// `MessageType` ordinal already used by the live sender/receiver — it
// is not a new contract:
//
//   MessageType   wire string (typical)    msg_type_byte (hex)
//   ────────────────────────────────────────────────────────────
//   text          "text" or ""             0x00
//   image         "image"                  0x01
//   video         "video"                  0x02
//   audio         "audio"                  0x03
//   voiceNote     "voiceNote"              0x04
//   file          "file"                   0x05
//   location      "location"               0x06
//
// Bytes >= 0x07 are reserved for future versioned extension and MUST
// NOT be emitted under "kayten-msg-aad-v1". Adding a new
// `msg_type_byte` value, removing one, or remapping any existing
// MessageType to a different byte REQUIRES a new explicit AAD version
// suffix (e.g. "kayten-msg-aad-v2") and a coordinated cross-repo
// rollout. The wire `string msg_type` may also evolve, but ANY change
// to the byte mapping above is a versioned contract change, not a
// silent rename.
//
// The trailing domain-version tag "kayten-msg-aad-v1" is the authoritative
// AAD version identifier. Any future AAD schema change REQUIRES a new
// explicit version suffix (e.g. "kayten-msg-aad-v2") and a coordinated
// cross-repo rollout — receivers MUST NOT accept silent AAD changes.
//
// Composite verification expectations (receivers MUST enforce all):
//   1. reconstruct `aad` from the same inputs the sender used;
//   2. reconstruct `transcript` from `iv_inner || ciphertext || tag_outer
//      || aad`;
//   3. verify `signature` against the sender's trusted identity key for
//      that transcript (the same sender device identity used for trust
//      lookup SHALL be used for signature verification);
//   4. decrypt with the authoritative wire-provided `iv_inner` /
//      `iv_outer` — never guess, reconstruct, or locally synthesize IVs.
//
// Proto + server relay contract:
//   - The server is an OPAQUE, byte-preserving relay for every composite
//     crypto field (`ciphertext`, `iv_inner`, `iv_outer`, `tag_outer`,
//     `signature`, and on edits: `new_ciphertext`, `new_iv_inner`,
//     `new_iv_outer`, `new_tag_outer`, `new_signature`).
//   - The server SHALL NOT interpret, normalize, synthesize, or repair
//     any crypto field — it is not a crypto-field repair layer.
//   - Delete/tombstone paths SHALL clear both legacy and composite
//     payload fields together.
message SendMessage {
  string conversation_id = 1;
  string recipient_id = 2;
  string recipient_device_id = 3;

  // Encrypted message body. Populated by both legacy and composite paths.
  bytes ciphertext = 4;

  // ── Legacy / transition fields ──────────────────────────────────────
  // These fields carry the pre-composite (single-IV, single/dual-tag)
  // crypto shape. They remain for backward compatibility with clients
  // that have not yet adopted the 0x40 ENCRYPT_AND_SIGN_MSG composite
  // runtime path.
  //
  // Sender rules during rollout:
  //   - Legacy-only senders MAY continue populating only legacy fields.
  //   - Composite-capable senders SHOULD dual-write both canonical
  //     composite fields and legacy compatibility fields.
  //   - Senders SHALL NOT populate conflicting values across legacy
  //     and composite fields.
  //
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".
  //
  // The server relays these fields transparently and does not interpret
  // the crypto payload.

  // Legacy single IV (pre-composite compatibility).
  bytes iv = 5;
  // Legacy single authentication tag (pre-composite compatibility).
  bytes tag = 6;

  // Ed25519 signature over the canonical composite messaging transcript
  // (SHA-256(iv_inner || ciphertext || tag_outer || aad) with `aad` as
  // defined in the "Canonical composite messaging contract" docblock
  // above). Composite receivers MUST verify this signature against the
  // sender's trusted identity key; they MUST NOT accept a signature that
  // only covers raw `ciphertext`. Legacy-only senders may still sign the
  // legacy envelope shape during rollout. Populated by both paths.
  bytes signature = 7;

  // Product/display message-type string. Canonical values are the
  // `MessageType` names: "text", "image", "video", "audio", "voiceNote",
  // "file", "location". Distinct from the AAD single-byte code: senders
  // MUST derive `msg_type_byte` (the AAD byte) from the canonical
  // `MessageType` ordinal using the frozen mapping in the "Canonical
  // composite messaging contract" docblock above before computing AAD.
  string msg_type = 8;
  int32 padded_size = 9;
  bytes ratchet_pub = 10;
  int32 ratchet_seq = 11;
  // Reply threading: ID of the message being replied to.
  string reply_to_message_id = 12;
  int32 ttl_seconds = 13;
  bool is_view_once = 14;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility).
  bytes tag_inner = 15;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path.
  bytes tag_outer = 16;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // These fields carry the composite crypto shape returned by the HSM
  // ENCRYPT_AND_SIGN_MSG path. `iv_inner` and `iv_outer` are authoritative
  // sender-produced composite AES-GCM IVs — they are NOT transport-only
  // hints, placeholders, or values that may be guessed, derived, or
  // locally synthesized by receivers. Composite-capable senders populate:
  //   ciphertext, iv_inner, iv_outer, tag_outer, signature
  //
  // The server relays these fields transparently and does not interpret,
  // rewrite, or synthesize any of the crypto payload or its metadata.
  //
  // Receiver precedence:
  //   1. If iv_inner / iv_outer are populated, receivers MUST use those
  //      populated values directly as the authoritative composite IVs
  //      (composite path). Receivers MUST NOT derive, guess, or locally
  //      synthesize iv_inner / iv_outer when they are present on the wire.
  //   2. Otherwise (both absent) receivers SHALL fall back to legacy `iv`.
  //   3. Receivers SHALL NOT ignore populated composite fields and
  //      silently prefer legacy fields.

  // Authoritative inner AES-GCM IV produced by the sender (composite
  // runtime). Receivers MUST use this value directly when present.
  bytes iv_inner = 17;
  // Authoritative outer AES-GCM IV produced by the sender (composite
  // runtime). Receivers MUST use this value directly when present.
  bytes iv_outer = 18;

  // Optional prekey bootstrap metadata. When present, this is the first
  // message in a new conversation and the responder MUST derive session
  // state from these fields before decrypting `ciphertext`.
  // Server relays this field transparently.
  PrekeyBootstrap prekey_bootstrap = 20;

  // Client-generated idempotency key for at-most-once server-side delivery.
  //
  // The sending device picks a stable UUID-v4 per logical outgoing message,
  // persists it alongside the local Drift/SwiftData/Room row, and carries
  // the SAME value on every WebSocket re-send of that message — including
  // the offline-queue drain after a reconnect and any explicit user retry.
  //
  // Server contract (kayten-server-client-msg-id-dedup-spec §2):
  //   * `(sender_device_id, client_msg_id)` is UNIQUE on the server's
  //     messages table. A second SendMessage carrying a pair the server
  //     has already persisted does NOT insert a new row and does NOT
  //     re-fan-out to recipients — the server re-emits the ORIGINAL
  //     MessageAck (same server-assigned `message_id`, same `server_seq`,
  //     same `timestamp`) so clients converge on one delivery regardless
  //     of how many retry acks they've already lost.
  //   * Empty value ⇒ legacy sender, no dedup. The row is inserted
  //     unconditionally (pre-2026-04-19 behaviour). Rollout-compatible.
  //
  // Privacy: the server stores this string but never inspects or indexes
  // it beyond the UNIQUE constraint — it is treated as an opaque client
  // correlation id. Senders SHOULD use a random UUID-v4 rather than any
  // value derived from plaintext.
  string client_msg_id = 21;

  // ── Wire-authoritative signer identity (CAP_WIRE_IDENTITY_V1) ────────
  // Ed25519 public key (32 bytes, raw) of the device that signed the
  // composite transcript in `signature`. MANDATORY for every
  // composite-capable sender post-CAP_WIRE_IDENTITY_V1.
  //
  // Receivers MUST use this wire-provided pub as the sole verifier for
  // the composite signature. Receivers MUST NOT fall back to any server
  // lookup (DeviceService.GetDeviceIdentityKey is for pre-flight
  // enrollment only; the receive path trusts the wire exclusively).
  // Receivers MUST reject the envelope with InvalidArgument when this
  // field is empty OR when its length is not exactly 32 bytes.
  //
  // Replaces the silent "first active device for user" fallback that
  // previously lived in DeviceService.GetIdentityKey — see the retired
  // handler comment in kayten-server/internal/device/handler_grpc.go
  // and the 2026-04-16 voice-call signer_identity_pub fix for the same
  // pattern on calling envelopes.
  //
  // The server SHOULD additionally validate `signer_identity_pub` at
  // ingress by comparing against `sender_device_id`'s registered
  // identity row; a mismatch is FailedPrecondition. This closes the
  // otherwise-open "compromised sender claims a different device's
  // identity" attack.
  //
  // The server relays this field transparently into `ReceiveMessage`.
  bytes signer_identity_pub = 22;

  // Group sender-key chain id. Populated only when this is a group
  // message send (recipient_id is empty + conversation_id refers to a
  // group conversation). Receivers use this to select the correct
  // sender-key seed pair from GroupMemberKeyState when running
  // GroupCryptoService.decryptGroupMessage. Default 0 = "not a group
  // send" (proto3 default — receivers MUST treat 0 as absent).
  // Server relays this field transparently.
  uint32 group_chain_id = 23;

  // DEPRECATED by unified crypto lifecycle spec §5 (2026-05-24).
  // Superseded by `recipient_identity_generation_at_session` (field 25)
  // + `recipient_session_generation_at_session` (field 26). Producers
  // MUST stop populating this field once consumers read the new fields.
  // Field number 24 and name "recipient_identity_commit_epoch_at_session"
  // are reserved for future removal — never reuse.
  //
  // Original MoHSM-97 semantics follow:
  // MoHSM-97 spec §3.2 — the recipient device's
  // `current_identity_commit_epoch` as known to the sender at SESSION
  // BOOTSTRAP time. Stamped on every outbound 1:1 SendMessage built
  // from that session.
  //
  // Server validation rules (spec §5.4):
  //   sent == current  → ACCEPT
  //   sent  < current  → REJECT STALE_RECIPIENT_SESSION
  //   sent  > current  → REJECT INVALID_RECIPIENT_EPOCH
  //   sent == 0        → lenient ACCEPT during migration window;
  //                      strict REJECT post-migration.
  //
  // Proto3 default 0 means "pre-delta sender" — server is lenient
  // during the migration window and logs a rate-limited warning.
  // See spec §11 for the deployment order: lenient first, then strict
  // only after zero-stamp traffic is eliminated from supported builds.
  //
  // Group messages (recipient_id empty, group_chain_id present) carry
  // this field at proto3 default 0 and are not validated by the
  // recipient-epoch guard. Only 1:1 recipient device targets are in scope.
  uint64 recipient_identity_commit_epoch_at_session = 24 [deprecated = true];

  // Unified crypto lifecycle §6 — the recipient device's `identity_generation`
  // as persisted in the sender's session row at BOOTSTRAP TIME (captured from
  // `GetPrekeyResponse.issued_at_identity_generation`).
  //
  // Server validation rules (spec §4.5):
  //   stamped == current  → ACCEPT
  //   stamped  < current (non-zero)  → REJECT, ErrorPayload stable_error_code = "STALE_RECIPIENT_IDENTITY"
  //   stamped  > current  → REJECT, ErrorPayload stable_error_code = "INVALID_RECIPIENT_GENERATION"
  //   stamped == 0        → lenient ACCEPT + rate-limited warn during migration window;
  //                         strict REJECT post-migration (spec §9 step 4)
  //
  // Sender MUST fail-closed when the session row has no stamped generation
  // (invalidate + rebootstrap before send — never stamp a guessed value).
  //
  // Proto3 default 0 = pre-delta sender; server is lenient during the
  // migration window. Server relays this field verbatim to `ReceiveMessage`
  // for receiver-side defense-in-depth (spec §7 step 4).
  uint64 recipient_identity_generation_at_session = 25;

  // Unified crypto lifecycle §6 — the recipient device's `session_generation`
  // as persisted in the sender's session row at BOOTSTRAP TIME (captured from
  // `GetPrekeyResponse.issued_at_session_generation`).
  //
  // Server validation rules (spec §4.5):
  //   stamped == current  → ACCEPT
  //   stamped  < current (non-zero)  → REJECT, ErrorPayload stable_error_code = "STALE_RECIPIENT_SESSION"
  //   stamped  > current  → REJECT, ErrorPayload stable_error_code = "INVALID_RECIPIENT_GENERATION"
  //   stamped == 0        → lenient ACCEPT + rate-limited warn during migration window
  //
  // Server relays this field verbatim to `ReceiveMessage.recipient_session_generation_at_session`.
  // Proto3 default 0 = pre-delta sender; server is lenient during migration.
  uint64 recipient_session_generation_at_session = 26;
}

message ReceiveMessage {
  string message_id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string sender_device_id = 4;

  // Encrypted message body. Populated by both legacy and composite paths.
  bytes ciphertext = 5;

  // ── Legacy / transition fields ──────────────────────────────────────
  // These fields carry the pre-composite (single-IV, single/dual-tag)
  // crypto shape. They remain for backward compatibility with clients
  // that have not yet adopted the 0x40 ENCRYPT_AND_SIGN_MSG composite
  // runtime path.
  //
  // Sender rules during rollout:
  //   - Legacy-only senders MAY continue populating only legacy fields.
  //   - Composite-capable senders SHOULD dual-write both canonical
  //     composite fields and legacy compatibility fields.
  //   - Senders SHALL NOT populate conflicting values across legacy
  //     and composite fields.
  //
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".
  //
  // The server relays these fields transparently and does not interpret
  // the crypto payload.

  // Legacy single IV (pre-composite compatibility).
  bytes iv = 6;
  // Legacy single authentication tag (pre-composite compatibility).
  bytes tag = 7;

  // Ed25519 signature over the canonical composite messaging transcript
  // (SHA-256(iv_inner || ciphertext || tag_outer || aad) with `aad` as
  // defined in the "Canonical composite messaging contract" docblock
  // above `SendMessage`). Composite receivers MUST verify this signature
  // against the sender's trusted identity key using the reconstructed
  // transcript; they MUST NOT accept a signature that only covers raw
  // `ciphertext`. Legacy-only senders may still sign the legacy envelope
  // shape during rollout. Populated by both paths.
  bytes signature = 8;

  // Product/display message-type string. See `SendMessage.msg_type` and
  // the "Canonical composite messaging contract" docblock for the
  // canonical mapping to the AAD single-byte code (`msg_type_byte:u8`)
  // that receivers MUST use when reconstructing AAD for verification.
  string msg_type = 9;
  int32 padded_size = 10;
  bytes ratchet_pub = 11;
  int32 ratchet_seq = 12;
  int64 server_seq = 13;
  google.protobuf.Timestamp server_timestamp = 14;
  // WP-BE-01/02: Message mutation and lifecycle fields
  string reply_to_message_id = 15;
  int32 edit_seq = 16;
  bool is_deleted_for_everyone = 17;
  int32 ttl_seconds = 18;
  bool is_view_once = 19;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility).
  bytes tag_inner = 20;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path.
  bytes tag_outer = 21;

  // Mirrors SendMessage.prekey_bootstrap. Present when this message is the
  // first in a conversation and the responder must derive session state
  // from the bootstrap before decrypting `ciphertext`.
  PrekeyBootstrap prekey_bootstrap = 22;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // These fields carry the composite crypto shape returned by the HSM
  // ENCRYPT_AND_SIGN_MSG path. `iv_inner` and `iv_outer` are authoritative
  // sender-produced composite AES-GCM IVs — they are NOT transport-only
  // hints, placeholders, or values that may be guessed, derived, or
  // locally synthesized by receivers. Composite-capable senders populate:
  //   ciphertext, iv_inner, iv_outer, tag_outer, signature
  //
  // The server relays these fields transparently and does not interpret,
  // rewrite, or synthesize any of the crypto payload or its metadata.
  //
  // Receiver precedence:
  //   1. If iv_inner / iv_outer are populated, receivers MUST use those
  //      populated values directly as the authoritative composite IVs
  //      (composite path). Receivers MUST NOT derive, guess, or locally
  //      synthesize iv_inner / iv_outer when they are present on the wire.
  //   2. Otherwise (both absent) receivers SHALL fall back to legacy `iv`.
  //   3. Receivers SHALL NOT ignore populated composite fields and
  //      silently prefer legacy fields.

  // Authoritative inner AES-GCM IV produced by the sender (composite
  // runtime). Receivers MUST use this value directly when present.
  bytes iv_inner = 23;
  // Authoritative outer AES-GCM IV produced by the sender (composite
  // runtime). Receivers MUST use this value directly when present.
  bytes iv_outer = 24;

  // Wire-authoritative signing identity (CAP_WIRE_IDENTITY_V1).
  // Relayed verbatim from `SendMessage.signer_identity_pub`. See the
  // field's docblock on `SendMessage` for the full contract.
  // Receivers MUST verify the composite signature against this key
  // and MUST NOT fall back to any server lookup.
  bytes signer_identity_pub = 25;

  // ── Receiver-warning metadata (2026-04-24 cross-repo identity
  //    production readiness plan §1, §4.7) ──────────────────────
  //
  // The three fields below are STAMPED BY THE SERVER on outbound
  // fan-out and on offline-sync drain. Senders never supply them.
  // The server derives the values from its `user_identity_lineages`
  // state at the moment the message is dispatched, so the receiver
  // sees the lineage snapshot that was authoritative when the
  // message was relayed.
  //
  // Receivers use these in addition to (not instead of) the
  // CAP_WIRE_IDENTITY_V1 TOFU pub mismatch detection. The wire-pub
  // path catches per-device key rotations (silent re-key on the
  // same device); these server-stamped fields catch user-level
  // identity rotations the sender's app may not yet have surfaced
  // locally — e.g. a freshly-rotated sender whose first message
  // arrives at a receiver that has never observed the new pub on
  // the wire before.
  //
  // Pre-delta servers omit these fields; receivers MUST treat the
  // absence as "no rotation signal" and fall back to TOFU-only
  // detection. Non-breaking rollout.

  // Monotonic per-user identity commit epoch at dispatch time. Mirrors
  // the value on the sender's lineage row (`server_identity_version`
  // in kayten-server `user_identity_lineages`). Zero when the server
  // has no lineage entry for the sender (legacy / pre-WP4.4).
  uint64 sender_identity_commit_epoch = 26;

  // Opaque server-issued lineage / rotation identifier. Equivalent
  // to `DeviceIdentity.current_rotation_id` for the sender's lineage
  // at dispatch time. Empty string when the server has no lineage
  // entry. Used by receiver UI to disambiguate "this is a rotation
  // I have already approved" vs "this is a brand-new rotation."
  string sender_identity_rotation_id = 27;

  // True when the sender's lineage carries a freshly-rotated identity
  // that has NOT yet been confirmed by a downstream receiver-side
  // verify gesture. The receiver SHOULD render the KEY_CHANGE_ALERT
  // surface and demand explicit user approval before accepting
  // further trusted messages from this sender. False (default) means
  // either no recent rotation or the rotation has already been
  // settled receiver-side.
  bool post_rotation_pending_verify = 28;

  // Group sender-key chain id, relayed verbatim from the sending
  // device's SendMessage.group_chain_id. See SendMessage docblock.
  uint32 group_chain_id = 29;

  // MoHSM-97 spec §3.2 — server relays the SendMessage value verbatim.
  // Receiver consumes for defense-in-depth check (spec §6.9):
  //   if stamped > 0 && stamped < EnrollmentManager.currentCommitEpoch():
  //     persist failed row with MessageDecryptStatus.failedStalePeerBundleReceived
  //
  // This is defense-in-depth only; the expected behavior is server-side
  // rejection before delivery (spec §5.4). Receivers MUST NOT delete the
  // local session or send a retry signal to the sender on this path.
  //
  // Proto3 default 0 = server did not stamp (pre-delta server or group
  // message); receiver skips the defense check when 0.
  uint64 recipient_identity_commit_epoch_at_session = 30;

  // ── Unified crypto lifecycle — server-stamped sender generations ────────
  // Fields 31–32 are STAMPED BY THE SERVER on outbound fan-out and on
  // offline-sync drain, derived from `senderConn.DeviceID`'s current
  // server-managed state. Senders NEVER supply these; receivers TRUST
  // them as authoritative.
  //
  // Pre-delta servers omit these fields; receivers MUST treat absence
  // (proto3 default 0) as "no generation signal" and fall back to the
  // existing TOFU-only KEY_CHANGE_ALERT path. Non-breaking rollout.

  // Unified crypto lifecycle §4.6 + §7 — the sender device's current
  // `identity_generation` at the moment the server relayed this message.
  // Receivers compare against the session row's `peerIdentityGeneration`:
  //   advancing + TOFU pub mismatch → KEY_CHANGE_ALERT (warn, spec §7.2)
  //   advancing + same TOFU pub    → defensive update of peerIdentityGeneration
  //   equal or 0                   → no action
  uint64 sender_identity_generation = 31;

  // Unified crypto lifecycle §4.6 + §7 — the sender device's current
  // `session_generation` at the moment the server relayed this message.
  // Receivers compare against the session row's `peerSessionGeneration`:
  //   sender_session_generation > peerSessionGeneration →
  //     candidate-bootstrap adoption path (spec §7.3 — silent reinstall
  //     recovery). Requires the envelope to carry a `prekey_bootstrap`.
  //     On success: atomically replace live session, update peerSessionGeneration,
  //     emit `SessionBootstrapAccepted` receipt.
  //     On failure or missing bootstrap: stash for replay; sender's
  //     bootstrap retransmit (spec §6) guarantees a bootstrap-bearing
  //     message follows.
  //   equal or 0 → no action (normal ratchet-forward message)
  uint64 sender_session_generation = 32;

  // ── Unified crypto lifecycle — relayed sender stamps (defense-in-depth) ─
  // Fields 33–34 are relayed VERBATIM from the sender's SendMessage.
  // The receiver uses them as a defense-in-depth check (spec §7 step 4):
  // if a stamped generation is strictly less than the receiver's own
  // current generation for that device, the message is from a sender
  // whose session was built against an older state of THIS device.
  // Expected behavior is server-side rejection before delivery (§4.5);
  // these fields are the receiver-side backstop.
  //
  // Proto3 default 0 = server did not relay (pre-delta server or group
  // message); receiver skips defense check when 0.

  // Unified crypto lifecycle §7 step 4 — relayed from
  // `SendMessage.recipient_identity_generation_at_session`. The receiver
  // checks: if stamped > 0 and stamped < receiver's current identity_generation,
  // the message was stamped against a stale identity of this device.
  // Persist as `failedStalePeerBundleReceived`; do NOT delete the session.
  uint64 recipient_identity_generation_at_session = 33;

  // Unified crypto lifecycle §7 step 4 — relayed from
  // `SendMessage.recipient_session_generation_at_session`. The receiver
  // checks: if stamped > 0 and stamped < receiver's current session_generation,
  // the message was stamped against a stale session of this device.
  // Same fail-closed posture as field 33.
  uint64 recipient_session_generation_at_session = 34;
}

message MessageAck {
  // Server-generated UUID (`messages.id` primary key). Persisted on
  // the sender's local row as `server_message_id` so subsequent
  // DELIVERY_RECEIPT / READ_RECEIPT envelopes (which reference the
  // server-side id) can be correlated back to the same row.
  string message_id = 1;
  int64 server_seq = 2;
  // Echoes the sender's `SendMessage.client_msg_id` so the sender's
  // app can correlate this ACK to the local row it inserted with
  // that UUID as primary key. Without this echo, the sender sees an
  // ACK for a server-generated UUID that does not exist in its
  // local DB and the bubble's delivery indicator stays on "sending"
  // forever. Empty string when the original SendMessage carried no
  // client_msg_id (legacy senders).
  string client_msg_id = 3;
}

message DeliveryReceipt {
  string message_id = 1;
  google.protobuf.Timestamp delivered_at = 2;
}

message ReadReceipt {
  string message_id = 1;
  google.protobuf.Timestamp read_at = 2;
}

message TypingIndicator {
  string conversation_id = 1;
  bool is_typing = 2;
}

// KeyExchangeRequest and KeyExchangeResponse have been removed — the old
// polling-based bootstrap flow is superseded by SendMessage.prekey_bootstrap
// (cross-repo-production-spec-v1 §3.1). Their Envelope oneof field numbers
// (30, 31) and EnvelopeType enum values (20, 21) are reserved above.

message KeyRatchetNotify {
  string conversation_id = 1;
  bytes new_ratchet_pub = 2;
  int32 ratchet_seq = 3;
}

message KeyChangeAlert {
  string device_id = 1;
  string reason = 2;
}

message PresenceUpdate {
  string user_id = 1;
  bool online = 2;
  google.protobuf.Timestamp last_seen = 3;
}

// PROFILE_UPDATE envelope payload. Fan-out by the server after a
// successful `UserService.UpdateProfile` RPC to every peer who shares
// a 1:1 conversation with the updating user, plus every co-member of
// any group the updating user belongs to. The recipient client uses
// this to refresh its local `contacts.displayName` / `avatarUrl` row
// for the rotating user, which in turn re-renders the Chats list
// tile title via the existing contacts->conversation provider join.
//
// Not encrypted: the server already sees these fields via the
// `UpdateProfile` RPC body and the existing contact-discovery flow,
// so an additional E2E wrap would not constrain server-side
// visibility further. Display name + avatar URL are user-published
// profile metadata, not message content.
//
// MoHSM-61 part 2 — cross-repo plan landed 2026-05-20. Pre-delta
// clients ignore unknown envelopes (Dart proto wire decoder); the
// client-side mitigation in `conversationListProvider` is the
// fallback when the server has not yet been upgraded.
message ProfileUpdate {
  // User id of the user whose profile changed.
  string user_id = 1;

  // New display name. Empty string means "unchanged" — clients MUST
  // NOT overwrite a populated local displayName with an empty
  // server-side value, so a user can clear neither field without an
  // explicit delete contract (out of scope for this delta).
  string display_name = 2;

  // New avatar URL. Empty string means "unchanged" with the same
  // contract as display_name.
  string avatar_url = 3;

  // Server-side wall-clock at which the update was persisted. Used
  // by clients as a last-write-wins tiebreaker if two updates race
  // (e.g. one over WS and one via discovery refresh).
  google.protobuf.Timestamp updated_at = 4;
}

message SyncRequest {
  int64 last_server_seq = 1;
  // Last event server_seq the client has seen (0 = first sync, return all events).
  int64 last_event_seq = 2;
}

message SyncResponse {
  repeated ReceiveMessage messages = 1;
  bool has_more = 2;
  // Event-append sync: mutations on old messages (edits, deletes, reactions)
  repeated MessageEvent events = 3;
}

message WsAuthRequest {
  bytes challenge = 1;
}

message WsAuthResponse {
  string jwt = 1;
  string device_id = 2;
  int32 protocol_version = 3;
  int64 last_server_seq = 4;
  string status = 5;
  int64 server_time = 6;
  string error_code = 7;
  // Ed25519 signature over (challenge || device_id) using the registered device identity key.
  // When present, the server verifies possession of the device private key.
  // When absent (legacy clients), the server falls back to JWT-only auth.
  bytes challenge_signature = 8;
}

message OpkReplenishNeeded {
  int32 remaining_count = 1;
  int32 recommended_upload = 2;
}

message DeviceRevoked {
  string device_id = 1;
  string reason = 2;
}

// GroupSenderKey carries a per-recipient, ratchet-protected distribution
// of a group sender-key seed to one member of a group conversation.
//
// Under the SKDM model (group-file-skdm-cross-repo-spec-v1 §2.1), the
// sender serializes an SkdmPayload, encrypts it through the existing
// 1:1 ratchet session to the target recipient, and carries the resulting
// ciphertext + ratchet metadata in this envelope. The server relays the
// envelope unmodified — it never sees sender-key material in plaintext.
//
// This message is NOT a device-bound wrapped key blob. The pre-SKDM
// `sender_key = 2` field has been removed; its field number is reserved
// to prevent reuse.
message GroupSenderKey {
  // Group conversation this sender key belongs to.
  string conversation_id = 1;

  // Reserved: the pre-SKDM `sender_key` blob (device-bound wrapped key
  // transport). Removed per group-file-skdm-cross-repo-spec-v1 §2.1.
  reserved 2;
  reserved "sender_key";

  // Single recipient of this per-member fanout envelope. The sender
  // emits one GroupSenderKey envelope per target member, each encrypted
  // through the 1:1 session to that member.
  string target_user_id = 3;

  // Sender identity — carried in plaintext at the envelope layer so the
  // recipient can look up the correct 1:1 ratchet session before
  // attempting to decrypt `ciphertext`.
  string sender_user_id = 4;
  string sender_device_id = 5;

  // 1:1-session ciphertext of the serialized SkdmPayload for this
  // recipient. Decrypted with the recipient's existing ratchet state
  // against `sender_user_id`/`sender_device_id`.
  bytes ciphertext = 6;

  // ── Legacy / transition fields ──────────────────────────────────────
  // These fields carry the pre-composite (single-IV) crypto shape for
  // the 1:1 ratchet protection of the SKDM distribution. They remain
  // for backward compatibility with clients that have not yet adopted
  // the composite runtime path.
  //
  // Sender rules during rollout:
  //   - Legacy-only senders MAY continue populating only legacy fields.
  //   - Composite-capable senders SHOULD dual-write both canonical
  //     composite fields and legacy compatibility fields if older
  //     recipients still exist.
  //   - Senders SHALL NOT populate conflicting values across legacy
  //     and composite fields.
  //
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".

  // Legacy single IV for the 1:1 SKDM encryption (pre-composite compatibility).
  bytes iv = 7;

  // Ed25519 signature over the distribution envelope, verifiable
  // against the sender's registered identity key. Populated by both
  // legacy and composite paths.
  bytes signature = 8;

  // Ratchet metadata required to advance the recipient's 1:1 ratchet
  // state and decrypt `ciphertext`.
  bytes ratchet_pub = 9;
  int32 ratchet_seq = 10;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility).
  bytes tag_inner = 11;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path.
  bytes tag_outer = 12;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // These fields carry the composite crypto shape for the 1:1-protected
  // SKDM distribution. Composite-capable senders populate:
  //   ciphertext, iv_inner, iv_outer, tag_outer, signature
  //
  // Receiver precedence:
  //   1. If iv_inner / iv_outer are populated, receivers SHALL prefer
  //      them (composite path).
  //   2. Otherwise receivers SHALL fall back to legacy `iv`.
  //   3. Receivers SHALL NOT ignore populated composite fields and
  //      silently prefer legacy fields.

  // Inner AES-GCM IV (composite runtime).
  bytes iv_inner = 13;
  // Outer AES-GCM IV (composite runtime).
  bytes iv_outer = 14;

  // Wire-authoritative signing identity (CAP_WIRE_IDENTITY_V1).
  // Ed25519 public key (32 bytes, raw) of the sender device. MANDATORY
  // for every composite-capable sender. Receivers MUST verify the
  // composite signature against this wire-provided pub and MUST NOT
  // fall back to any server-side identity lookup. See the
  // SendMessage.signer_identity_pub docblock for the full contract.
  bytes signer_identity_pub = 15;

  // DEPRECATED by unified crypto lifecycle spec §5 (2026-05-24).
  // Superseded by `recipient_identity_generation_at_session` (field 17)
  // + `recipient_session_generation_at_session` (field 18). Field number
  // 16 and name "recipient_identity_commit_epoch_at_session" are reserved
  // for future removal — never reuse.
  //
  // Original MoHSM-97 semantics follow:
  // MoHSM-97 spec §3.2 — same semantics as
  // SendMessage.recipient_identity_commit_epoch_at_session. Stamped on
  // each per-recipient SKDM fanout envelope. The 1:1 session ciphertext
  // inside `ciphertext` is encrypted under the recipient's ratchet state,
  // so the same staleness failure mode applies as SendMessage.
  //
  // Server resolves `target_user_id` → active device and validates per
  // the same guard as SendMessage (spec §5.4). In future multi-device
  // fanout, each per-device envelope MUST carry its own stamp — do not
  // silently reuse one user's stamp for multiple devices.
  //
  // Proto3 default 0 = pre-delta sender; server is lenient during the
  // migration window. See spec §11.
  uint64 recipient_identity_commit_epoch_at_session = 16 [deprecated = true];

  // Unified crypto lifecycle §6 — same semantics as
  // SendMessage.recipient_identity_generation_at_session. Stamped on
  // each per-recipient SKDM fanout envelope from the sender's session row
  // at bootstrap time.
  //
  // Server resolves `target_user_id` → active device and validates per
  // the same `RecipientGenerationGuard` rules as SendMessage (spec §4.5).
  // In future multi-device fanout, each per-device envelope MUST carry
  // its own stamp — do not silently reuse one device's stamp for another.
  //
  // Proto3 default 0 = pre-delta sender; server is lenient during migration.
  uint64 recipient_identity_generation_at_session = 17;

  // Unified crypto lifecycle §6 — same semantics as
  // SendMessage.recipient_session_generation_at_session. Stamped per
  // per-recipient SKDM fanout envelope.
  //
  // Server validates against recipient's current `session_generation`
  // per the same guard as SendMessage.
  //
  // Proto3 default 0 = pre-delta sender; server is lenient during migration.
  uint64 recipient_session_generation_at_session = 18;
}

// SkdmPayload is the plaintext carried inside GroupSenderKey.ciphertext.
// It is never sent on the wire unencrypted — it is serialized, then
// encrypted through the sender's 1:1 ratchet session to each recipient,
// and the resulting bytes are carried in GroupSenderKey.ciphertext.
//
// The seeds are raw key material the recipient stores locally (for
// example via wrap_storage_root_key) and uses as HKDF input for the
// group ratchet chains that decrypt subsequent group messages from this
// sender on this chain.
message SkdmPayload {
  // Group conversation this sender key belongs to.
  string conversation_id = 1;

  // Monotonically increasing chain id. A sender rotates chain_id when
  // starting a new group sender-key chain (for example after a group
  // membership change or a forced rekey).
  uint32 chain_id = 2;

  // Inner seed — exactly 32 bytes. Protobuf cannot enforce the exact
  // length at the schema level; the application layer MUST validate
  // `len(inner_seed) == 32` before use.
  bytes inner_seed = 3;

  // Outer seed — exactly 32 bytes. Protobuf cannot enforce the exact
  // length at the schema level; the application layer MUST validate
  // `len(outer_seed) == 32` before use.
  bytes outer_seed = 4;

  // Sender's Ed25519 identity public key, echoed so the recipient can
  // bind the seeds to the expected signing identity independently of
  // the transport-layer 1:1 session lookup.
  bytes signing_pub = 5;
}

message GroupMemberEvent {
  string conversation_id = 1;
  string user_id = 2;
  string event_type = 3;        // "joined" or "left"
  string display_name = 4;
  google.protobuf.Timestamp timestamp = 5;
}

// Edit a previously sent message. Requires new ciphertext (ratchet advance).
//
// Rollout behavior:
//   - Legacy-only senders MAY populate only legacy fields and MAY leave
//     `new_signature` empty.
//   - Composite-capable senders MUST populate:
//       new_ciphertext, new_iv_inner, new_iv_outer, new_tag_outer,
//       new_signature
//     and SHOULD also dual-write legacy compatibility fields.
//   - Senders SHALL NOT populate conflicting values across legacy
//     and composite fields.
//   - Receivers MUST treat an edit as composite when `new_iv_inner`
//     and `new_iv_outer` are both populated.
//   - Composite edit receivers MUST require `new_signature`. If
//     composite fields are present but `new_signature` is empty,
//     malformed, or fails verification, receivers MUST reject the edit.
//   - Receivers SHALL NOT ignore populated composite fields and
//     silently prefer legacy fields.
//
// Hardened edit replay contract:
//   - An edit does NOT advance the hardened local-history replay chain.
//   - On historical reopen, receivers MUST replay the edit using the
//     original message row's replay coordinates (ratchet_pub / ratchet_seq
//     captured at the time the original message was first decrypted).
//   - `new_ratchet_pub` / `new_ratchet_seq` on this message are legacy
//     compatibility data and are NOT authoritative replay metadata for
//     hardened historical reopen.
//   - `edit_ratchet_epoch` + `edit_message_counter` (fields 14 + 15) are
//     the authoritative hardened-history replay coordinates. They MUST
//     mirror the `ratchetEpoch` and `messageCounter` on the original
//     message row so hardened-production receivers
//     (allowLegacyWrappedMessageKeyFallback=false) can re-derive the
//     original per-message inner key via HistoryKeyRederiver (nearest
//     counter-0 anchor + bounded forward advance). An edit reuses the
//     SAME inner key as the original message — no chain advance.
//
// The server relays these fields transparently and does not interpret
// the crypto payload.
message EditMessage {
  string message_id = 1;
  string conversation_id = 2;

  // Encrypted replacement body. Populated by both legacy and composite paths.
  bytes new_ciphertext = 3;

  // ── Legacy / transition fields ──────────────────────────────────────
  // Pre-composite crypto shape. Kept for backward compatibility.
  // In proto3 an unpopulated bytes field is zero-length in generated
  // clients; receivers MUST treat zero-length as "absent".

  // Legacy single IV (pre-composite compatibility).
  bytes new_iv = 4;
  // Legacy single authentication tag (pre-composite compatibility).
  bytes new_tag = 5;

  int32 edit_seq = 6;

  // Legacy compatibility ratchet coordinates. These are NOT authoritative
  // replay metadata for hardened historical reopen — hardened edit replay
  // reuses the original message row's ratchet coordinates captured when
  // the original message was first decrypted. See the message-level
  // "Hardened edit replay contract" comment above.
  bytes new_ratchet_pub = 7;
  int32 new_ratchet_seq = 8;

  // Legacy Doppel-AES inner GCM tag (pre-composite compatibility, 16 bytes).
  bytes new_tag_inner = 9;
  // Outer GCM authentication tag. Used by both the legacy Doppel path
  // and the canonical composite runtime path (16 bytes).
  bytes new_tag_outer = 10;

  // ── Canonical composite runtime fields (0x40 / 0x41) ────────────────
  // `new_iv_inner` and `new_iv_outer` are authoritative sender-produced
  // composite AES-GCM IVs for the edit payload — they are NOT transport-
  // only hints, placeholders, or values that may be guessed, derived, or
  // locally synthesized by receivers. Composite-capable senders MUST
  // populate:
  //   new_ciphertext, new_iv_inner, new_iv_outer, new_tag_outer,
  //   new_signature
  //
  // The server relays these fields transparently and does not interpret,
  // rewrite, or synthesize any of the crypto payload or its metadata.
  // Receivers MUST use populated composite IVs directly and MUST NOT
  // derive, guess, or locally synthesize them when they are present on
  // the wire.

  // Authoritative inner AES-GCM IV produced by the sender for the edit
  // payload (composite runtime). Receivers MUST use this value directly
  // when present.
  bytes new_iv_inner = 11;
  // Authoritative outer AES-GCM IV produced by the sender for the edit
  // payload (composite runtime). Receivers MUST use this value directly
  // when present.
  bytes new_iv_outer = 12;
  // Ed25519 signature over the canonical composite edit transcript.
  // This is NOT an arbitrary repo-local signature; senders MUST sign
  // the following transcript in this exact order:
  //
  //   1. domain prefix: ASCII "kayten-edit-v1"
  //   2. message_id
  //   3. conversation_id
  //   4. edit_seq
  //   5. new_ratchet_seq
  //   6. new_ciphertext
  //   7. new_iv_inner
  //   8. new_iv_outer
  //   9. new_tag_outer
  //
  // Composite edit receivers MUST require this field and verify it
  // against the reconstructed transcript using the sender's registered
  // Ed25519 identity key. If it is empty, malformed, or fails
  // verification the edit MUST be rejected.
  // Legacy edit senders MAY leave this field empty.
  bytes new_signature = 13;

  // ── Hardened-history replay coordinates (P5.1, 2026-04-17) ──────────
  // Authoritative ratchet coordinates for hardened-history anchor
  // re-derive on the receiver side. Receivers running in real-HSM mode
  // with allowLegacyWrappedMessageKeyFallback=false REQUIRE these to
  // re-derive the original per-message inner key via
  // HistoryKeyRederiver (nearest counter-0 anchor for
  // (conversation_id, direction=incoming, edit_ratchet_epoch) +
  // bounded forward advance to edit_message_counter). The values
  // match the `ratchetEpoch` and `messageCounter` on the original
  // message row; edits replay the same inner key, no new chain
  // advance.
  //
  // Rollout:
  //   - Composite-capable senders (post-2026-04-17) MUST populate both
  //     fields with the original message row's coords.
  //   - Pre-2026-04-17 senders omit these; proto3 default values are
  //     `edit_ratchet_epoch = 0` and `edit_message_counter = 0`.
  //   - Receivers MUST treat (0, 0) as "absent" during the migration
  //     window and fall back to the legacy `wrappedMessageKey` path
  //     via allowLegacyWrappedMessageKeyFallback=true.
  //   - Once the flag flips to false in hardened production, edits
  //     that arrive with both fields still at proto3 defaults from
  //     pre-fix senders MUST fail closed — receivers SHOULD keep the
  //     pre-edit row visible and surface a "couldn't apply edit" hint.
  //   - Senders SHALL NOT populate one field and leave the other at
  //     its proto3 default; both fields are populated together or not
  //     at all.
  //
  // Known edge case (P5.1-review, 2026-04-17): a legitimate first
  // message of the first epoch has coords
  // (ratchetEpoch = 0, messageCounter = 0). Because proto3 scalar
  // defaults also yield (0, 0), the receiver cannot distinguish
  // "post-fix sender editing the very first message of the
  // conversation" from "pre-fix sender omitting these fields". The
  // receiver-side `hasWireCoords = wireEpoch != 0 || wireCounter != 0`
  // test misclassifies this case as "pre-fix sender".
  //
  // Impact: editing the very first message of a conversation with
  // allowLegacyWrappedMessageKeyFallback = false will fail closed; the
  // user sees the pre-edit body. The sender can re-send as a new
  // message. Counter-0 anchors DO seed at epoch 0, so this is a real
  // (if narrow) corner case — not a purely theoretical concern.
  //
  // Mitigation / follow-up: a future proto delta may convert these to
  // google.protobuf.Int32Value / Int64Value wrappers for unambiguous
  // absence signaling (wrapper-present ⇒ populated, wrapper-absent ⇒
  // legacy). Not blocking for the migration window because the
  // user-visible impact is limited to "edit of the very first message
  // post-flag-flip" and the fail-closed behavior is correct.
  int32 edit_ratchet_epoch = 14;
  int64 edit_message_counter = 15;

  // Wire-authoritative signing identity (CAP_WIRE_IDENTITY_V1).
  // Ed25519 public key (32 bytes, raw) of the device that produced
  // `new_signature`. MANDATORY for every composite-capable sender
  // post-CAP_WIRE_IDENTITY_V1. Receivers MUST verify `new_signature`
  // against this wire-provided pub and MUST NOT fall back to any
  // server-side identity lookup. See the SendMessage.signer_identity_pub
  // docblock for the full contract.
  bytes signer_identity_pub = 16;
}

// Delete a message for all participants.
message DeleteMessage {
  string message_id = 1;
  string conversation_id = 2;
}

// Add a reaction to a message.
message AddReaction {
  string message_id = 1;
  string conversation_id = 2;
  string reaction = 3;  // Unicode emoji, max 16 bytes
}

// Remove a reaction from a message.
message RemoveReaction {
  string message_id = 1;
  string conversation_id = 2;
  string reaction = 3;
}

// A mutation event on an existing message (for event-append sync).
message MessageEvent {
  string event_id = 1;
  string message_id = 2;
  string conversation_id = 3;
  string event_type = 4;     // "edit", "delete", "add_reaction", "remove_reaction"
  string actor_id = 5;
  int64 server_seq = 6;
  google.protobuf.Timestamp created_at = 7;
  // Payload varies by event_type:
  // edit: new_ciphertext, new_iv, new_tag, edit_seq
  // delete: (empty)
  // add_reaction/remove_reaction: reaction string
  bytes payload_data = 8;
}

message SetConversationTtl {
  string conversation_id = 1;
  int32 ttl_seconds = 2;  // 0 = disabled
}

// MoHSM-73 — Pin a message. Soft pin: the server treats this as a
// blind relay (per the "server is blind" architecture); the pinned
// state is mirrored on every recipient device via this envelope. No
// ciphertext, no key material — pinning is metadata only.
//
// Cap enforcement (1 for 1:1, 3 for groups) is a client-side concern.
// When a new PIN_MESSAGE pushes the chat past its cap, the client
// silently emits an UNPIN_MESSAGE for the oldest pinned row first.
message PinMessage {
  string message_id = 1;
  string conversation_id = 2;
  google.protobuf.Timestamp pinned_at = 3;
}

// MoHSM-73 — Unpin a previously-pinned message. Either an explicit
// user action OR an implicit cap-driven eviction. Idempotent: applying
// UnpinMessage to an already-unpinned row is a no-op on every device.
message UnpinMessage {
  string message_id = 1;
  string conversation_id = 2;
}

message ErrorPayload {
  int32 code = 1;
  string message = 2;

  // MoHSM-97 spec §3.2 — stable string error code for client routing
  // logic. Examples: "STALE_RECIPIENT_SESSION", "INVALID_RECIPIENT_EPOCH".
  // Empty for legacy/unrouted errors. Receivers MUST route on this
  // field, NOT on the numeric `code` (which remains for legacy compat).
  //
  // WsClient routing (spec §6.8): if stable_error_code == "STALE_RECIPIENT_SESSION",
  // consume and call StaleRecipientSessionRecoveryService; do NOT forward
  // to IncomingMessageHandler._handleError. All other values preserve
  // existing forwarding behavior.
  string stable_error_code = 3;

  // MoHSM-97 spec §3.2 — identifier of the envelope this error refers to.
  // For SendMessage: the client_msg_id of the rejected envelope.
  // For GroupSenderKey: the original envelope id (no client_msg_id field).
  // Empty for unsolicited errors. Receivers correlate to the in-memory
  // pending-ack map by this field (spec §6.8 removePendingAckForError).
  string original_envelope_id = 4;

  // MoHSM-97 spec §3.2 — optional structured details, k/v map for
  // stable_error_code-specific context. MUST NOT contain plaintext or
  // key material.
  //
  // For STALE_RECIPIENT_SESSION and INVALID_RECIPIENT_EPOCH the server
  // populates:
  //   "sent_epoch"          -> "<uint64 as decimal string>"
  //   "current_epoch"       -> "<uint64 as decimal string>"
  //   "recipient_device_id" -> "<uuid>"
  // Empty for error codes without structured details.
  map<string, string> details = 5;
}
