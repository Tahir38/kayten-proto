syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

service UserService {
  rpc GetProfile(GetProfileRequest) returns (UserProfile);
  rpc UpdateProfile(UpdateProfileRequest) returns (UserProfile);

  // Permanently delete the authenticated user's account and all associated data.
  // DSGVO Art. 17 compliance. Irreversible.
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);

  // WP-BE-03: Privacy visibility settings
  rpc GetPrivacySettings(GetPrivacySettingsRequest) returns (PrivacySettings);
  rpc UpdatePrivacySettings(UpdatePrivacySettingsRequest) returns (PrivacySettings);
}

message GetProfileRequest {
  string user_id = 1;
}

message UpdateProfileRequest {
  string display_name = 1;
  string avatar_url = 2;
  string status_message = 3;
}

message UserProfile {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string status_message = 4;
}

// DeleteAccountRequest requires no fields — the user is identified by
// the JWT access token in the gRPC metadata.
message DeleteAccountRequest {}

message DeleteAccountResponse {
  bool success = 1;
  // Approximate counts of deleted records for audit logging.
  int32 deleted_messages = 2;
  int32 deleted_files = 3;
  int32 deleted_devices = 4;
}

// WP-BE-03: Privacy visibility settings

message GetPrivacySettingsRequest {}

message UpdatePrivacySettingsRequest {
  // Visibility scopes: "everyone", "contacts", "nobody"
  string last_seen_visibility = 1;
  string online_visibility = 2;
  string profile_photo_visibility = 3;
  bool read_receipts_enabled = 4;
  bool typing_indicators_enabled = 5;
}

message PrivacySettings {
  string last_seen_visibility = 1;
  string online_visibility = 2;
  string profile_photo_visibility = 3;
  bool read_receipts_enabled = 4;
  bool typing_indicators_enabled = 5;
}
