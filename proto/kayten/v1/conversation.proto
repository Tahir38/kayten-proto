syntax = "proto3";

package kayten.v1;

option go_package = "github.com/kayten-gmbh/kayten-server/pkg/generated/kayten/v1;kaytenv1";

import "google/protobuf/timestamp.proto";

// ConversationService manages conversations between users.
// Direct (1:1) conversations are idempotent — creating one that already
// exists returns the existing conversation rather than a duplicate.
service ConversationService {
  // Creates a new conversation. For direct (1:1) conversations, returns
  // the existing conversation if one already exists between the two users.
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);

  // Lists all conversations for the authenticated user.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);

  // Gets the members of a specific conversation.
  rpc GetConversationMembers(GetConversationMembersRequest) returns (GetConversationMembersResponse);

  // Adds members to an existing group conversation.
  rpc AddGroupMembers(AddGroupMembersRequest) returns (AddGroupMembersResponse);

  // Leaves a group conversation. Self-removal only; direct conversations cannot be left.
  rpc LeaveConversation(LeaveConversationRequest) returns (LeaveConversationResponse);

  // Updates group conversation metadata (title).
  rpc UpdateConversation(UpdateConversationRequest) returns (UpdateConversationResponse);

  // WP-BE-04: Advanced group administration
  // Promote or demote a member's role (admin only).
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);
  // Remove a member from a group conversation (admin only).
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // Create an invite link for a group conversation (admin only).
  rpc CreateInviteLink(CreateInviteLinkRequest) returns (CreateInviteLinkResponse);
  // Join a group conversation via invite link.
  rpc JoinViaInvite(JoinViaInviteRequest) returns (JoinViaInviteResponse);
}

message CreateConversationRequest {
  // Conversation type: "direct" for 1:1 or "group" for multi-party.
  string type = 1;
  // User IDs of the members to include (must include the other party,
  // the authenticated user is added automatically).
  repeated string member_ids = 2;
  // Optional title for group conversations.
  string title = 3;
}

message CreateConversationResponse {
  string conversation_id = 1;
  string type = 2;
  // True when an existing direct conversation was returned instead of
  // creating a new one (idempotent behaviour).
  bool already_existed = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListConversationsRequest {
  int32 limit = 1;   // max items; 0 defaults to 50
  int32 offset = 2;  // pagination offset
}

message ListConversationsResponse {
  repeated ConversationInfo conversations = 1;
}

message ConversationInfo {
  string conversation_id = 1;
  string type = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated ConversationMember members = 4;
  string title = 5;
}

message AddGroupMembersRequest {
  string conversation_id = 1;
  repeated string member_ids = 2;
}

message AddGroupMembersResponse {
  repeated ConversationMember added_members = 1;
}

message LeaveConversationRequest {
  string conversation_id = 1;
}

message LeaveConversationResponse {}

message UpdateConversationRequest {
  string conversation_id = 1;
  string title = 2;
}

message UpdateConversationResponse {
  string title = 1;
}

message GetConversationMembersRequest {
  string conversation_id = 1;
}

message GetConversationMembersResponse {
  repeated ConversationMember members = 1;
}

message ConversationMember {
  string user_id = 1;
  string display_name = 2;
  google.protobuf.Timestamp joined_at = 3;
  string role = 4;  // "admin" or "member"
}

// WP-BE-04: Advanced group administration messages

message SetMemberRoleRequest {
  string conversation_id = 1;
  string user_id = 2;      // target member
  string role = 3;          // "admin" or "member"
}

message SetMemberRoleResponse {}

message RemoveMemberRequest {
  string conversation_id = 1;
  string user_id = 2;      // member to remove
}

message RemoveMemberResponse {}

message CreateInviteLinkRequest {
  string conversation_id = 1;
  int32 max_uses = 2;                        // 0 = unlimited
  google.protobuf.Timestamp expires_at = 3;  // optional expiry
}

message CreateInviteLinkResponse {
  string invite_code = 1;
  string invite_url = 2;   // e.g. "kayten://join/{invite_code}"
}

message JoinViaInviteRequest {
  string invite_code = 1;
}

message JoinViaInviteResponse {
  string conversation_id = 1;
}
